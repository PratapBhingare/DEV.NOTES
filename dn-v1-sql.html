<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="dev-prep-favicon.png">
    <title>SQL Interview Questions</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           THEME VARIABLES
        ========================= */

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;

            --text: #0f172a;
            --muted: #64748b;

            --border: #e2e8f0;

            --accent: #2563eb;
            --accent-soft: #eff6ff;
        }


        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #263449;

            --text: #f8fafc;
            --muted: #94a3b8;

            --border: #334155;

            --accent: #60a5fa;
            --accent-soft: #172554;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: var(--surface);

            border-bottom: 1px solid var(--border);
        }


        .nav-container {
            max-width: 1100px;

            margin: auto;

            padding: 14px 20px;

            display: flex;
            align-items: center;
            gap: 20px;
        }


        /* LOGO */

        .logo {
            color: var(--text);

            text-decoration: none;

            font-size: 18px;
            font-weight: 700;

            white-space: nowrap;
        }


        .logo span {
            color: var(--accent);
        }


        /* DESKTOP NAVIGATION */

        .nav-links {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;
        }


        .nav-links a {
            color: var(--muted);

            text-decoration: none;

            font-size: 14px;

            padding: 8px 10px;

            border-radius: 7px;

            transition: 0.2s;
        }


        .nav-links a:hover {
            background: var(--surface-hover);
            color: var(--text);
        }


        .nav-links a.active {
            background: var(--accent-soft);
            color: var(--accent);
        }


        /* =========================
           NAV ACTIONS
        ========================= */

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /* THEME BUTTON */

        .theme-btn {
            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }


        .theme-btn:hover {
            background: var(--surface-hover);
        }


        /* MOBILE MENU BUTTON */

        .menu-btn {
            display: none;

            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 20px;
        }


        /* =========================
           MOBILE DROPDOWN
        ========================= */

        .mobile-menu {
            display: none;

            max-width: 1100px;

            margin: auto;

            padding: 0 15px 15px;
        }


        .mobile-menu.open {
            display: block;
        }


        .mobile-menu a {
            display: block;

            color: var(--muted);

            text-decoration: none;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 15px;

            transition: 0.2s;
        }


        .mobile-menu a:hover,
        .mobile-menu a.active {
            background: var(--surface-hover);
            color: var(--text);
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 850px;

            margin: auto;

            padding: 70px 20px 100px;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            margin-bottom: 40px;
        }


        .page-header span {
            color: var(--accent);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.5px;
        }


        .page-header h1 {
            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.1;

            margin: 10px 0;

            letter-spacing: -1px;
        }


        .page-header p {
            color: var(--muted);

            line-height: 1.7;

            max-width: 650px;

            font-size: 15px;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {
            width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 12px;

            margin-bottom: 14px;

            overflow: hidden;

            transition:
                border-color 0.2s,
                transform 0.2s;
        }


        .question-card:hover {
            border-color: color-mix(in srgb,
                    var(--accent) 40%,
                    var(--border));
        }


        /* QUESTION BUTTON */

        .question-btn {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 20px;

            border: none;

            background: transparent;

            color: var(--text);

            text-align: left;

            font-family: inherit;

            font-size: 16px;
            font-weight: 600;

            line-height: 1.5;

            cursor: pointer;
        }


        .question-btn:hover {
            background: var(--surface-hover);
        }


        /* ARROW */

        .arrow {
            flex-shrink: 0;

            color: var(--muted);

            font-size: 18px;

            transition: transform 0.2s;
        }


        /* ANSWER */

        .answer {
            display: none;

            padding: 0 20px 20px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;
        }


        .question-card.open .answer {
            display: block;
        }


        .question-card.open .arrow {
            transform: rotate(180deg);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .nav-container {
                padding: 13px 16px;
            }


            .nav-links {
                display: none;
            }


            .menu-btn {
                display: block;
            }


            .nav-actions {
                margin-left: auto;
            }


            main {
                padding-top: 55px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-container {
                padding: 11px 14px;
            }


            .logo {
                font-size: 17px;
            }


            .menu-btn,
            .theme-btn {
                width: 34px;
                height: 34px;
            }


            main {
                padding: 45px 15px 70px;
            }


            .page-header {
                margin-bottom: 30px;
            }


            .page-header span {
                font-size: 11px;
            }


            .page-header h1 {
                font-size: 34px;

                margin-top: 8px;
            }


            .page-header p {
                font-size: 14px;

                line-height: 1.7;
            }


            .question-card {
                border-radius: 10px;

                margin-bottom: 10px;
            }


            .question-btn {
                padding: 16px;

                font-size: 14px;

                gap: 12px;
            }


            .answer {
                padding: 0 16px 17px;

                font-size: 14px;

                line-height: 1.7;
            }


            .arrow {
                font-size: 16px;
            }

        }


        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 380px) {

            .logo {
                font-size: 16px;
            }


            main {
                padding-left: 12px;
                padding-right: 12px;
            }


            .page-header h1 {
                font-size: 30px;
            }


            .question-btn {
                padding: 14px;

                font-size: 13px;
            }


            .answer {
                padding-left: 14px;
                padding-right: 14px;

                font-size: 13px;
            }

        }
    </style>
</head>

            </h1>

            <p>
                Important SQL concepts and interview
                questions, from fundamentals to advanced topics.
            </p>

        </header>

        <section id="questions"></section>

    <script>


        /* =========================
           QUESTIONS
        ========================= */

        const questions = [

            {
                question: "What is SQL and what is a relational database?",

                answer: `
            <p>
                <strong>SQL (Structured Query Language)</strong> is a language used
                to store, retrieve, update, and manage data in relational databases.
            </p>

            <p>
                A <strong>relational database</strong> stores data in tables consisting
                of rows and columns. Tables can be related to each other using keys
                such as primary keys and foreign keys.
            </p>

            <h4>Examples:</h4>

            <p>
                MySQL, PostgreSQL, SQL Server, and Oracle are popular relational
                database systems.
            </p>

            <p>
                In an interview, you can say: SQL is the language used to communicate
                with relational databases, while a relational database organizes
                structured data into related tables.
            </p>
        `
            },

            {
                question: "What is the difference between SQL and NoSQL?",

                answer: `
            <p>
                <strong>SQL databases</strong> are generally relational and store
                structured data in tables with predefined schemas.
            </p>

            <p>
                <strong>NoSQL databases</strong> are non-relational and can store
                data in formats such as documents, key-value pairs, graphs, or
                wide-column structures.
            </p>

            <h4>Key Differences:</h4>

            <ul>
                <li>
                    <strong>SQL:</strong> Table-based and usually uses a predefined schema.
                </li>
                <li>
                    <strong>NoSQL:</strong> Flexible data models and schema.
                </li>
                <li>
                    <strong>SQL:</strong> Supports powerful joins and relational queries.
                </li>
                <li>
                    <strong>NoSQL:</strong> Often preferred for flexible or rapidly
                    changing data structures.
                </li>
                <li>
                    <strong>SQL:</strong> Commonly used when strong relationships
                    and transactional consistency are important.
                </li>
            </ul>

            <p>
                Examples of SQL databases include PostgreSQL and MySQL.
                MongoDB and Redis are examples of NoSQL databases.
            </p>
        `
            },

            {
                question: "What is a table, row, column, and record?",

                answer: `
            <p>
                A <strong>table</strong> is a structure used to organize related
                data in a relational database.
            </p>

            <ul>
                <li>
                    <strong>Table:</strong> A collection of related data organized
                    into rows and columns.
                </li>
                <li>
                    <strong>Column:</strong> Represents a specific attribute or
                    property of the data.
                </li>
                <li>
                    <strong>Row:</strong> Represents one complete entry in a table.
                </li>
                <li>
                    <strong>Record:</strong> Another term commonly used for a row
                    containing one complete set of data.
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
id | name  | email
1  | John  | john@example.com
2  | Sarah | sarah@example.com
            </code></pre>

            <p>
                Here, <code>users</code> is the table, <code>name</code> and
                <code>email</code> are columns, and each individual user entry
                is a row or record.
            </p>
        `
            },

            {
                question: "What are Primary Key and Foreign Key?",

                answer: `
            <p>
                A <strong>Primary Key</strong> uniquely identifies each row in a table.
                It must contain unique values and cannot contain <code>NULL</code>.
            </p>

            <p>
                A <strong>Foreign Key</strong> is a column that references a key,
                usually the primary key, in another table. It is used to establish
                a relationship between tables.
            </p>

            <h4>Example:</h4>

            <pre><code>
users
id | name
1  | John
2  | Sarah

orders
id | user_id | amount
101| 1       | 500
102| 2       | 800
            </code></pre>

            <p>
                Here, <code>users.id</code> is the primary key and
                <code>orders.user_id</code> is a foreign key referencing
                <code>users.id</code>.
            </p>
        `
            },

            {
                question: "What are constraints in SQL?",

                answer: `
            <p>
                <strong>Constraints</strong> are rules applied to table columns
                to maintain data accuracy, validity, and integrity.
            </p>

            <h4>Common SQL Constraints:</h4>

            <ul>
                <li>
                    <strong>PRIMARY KEY:</strong> Uniquely identifies each row.
                </li>
                <li>
                    <strong>FOREIGN KEY:</strong> Maintains a relationship between
                    tables.
                </li>
                <li>
                    <strong>UNIQUE:</strong> Ensures that values in a column are unique.
                </li>
                <li>
                    <strong>NOT NULL:</strong> Prevents a column from containing
                    <code>NULL</code>.
                </li>
                <li>
                    <strong>CHECK:</strong> Ensures that values satisfy a specified condition.
                </li>
                <li>
                    <strong>DEFAULT:</strong> Provides a default value when no value
                    is supplied.
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
CREATE TABLE users (
    id INT PRIMARY KEY,
    email VARCHAR(100) UNIQUE NOT NULL,
    age INT CHECK (age &gt;= 18),
    status VARCHAR(20) DEFAULT 'active'
);
            </code></pre>
        `
            },

            {
                question: "What is the difference between WHERE and HAVING?",

                answer: `
            <p>
                Both <code>WHERE</code> and <code>HAVING</code> are used to filter
                data, but they operate at different stages of a query.
            </p>

            <ul>
                <li>
                    <strong>WHERE:</strong> Filters individual rows before
                    <code>GROUP BY</code> and aggregation.
                </li>
                <li>
                    <strong>HAVING:</strong> Filters grouped results after
                    <code>GROUP BY</code> and aggregation.
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
SELECT city, COUNT(*) AS total_users
FROM users
WHERE age &gt; 18
GROUP BY city
HAVING COUNT(*) &gt; 5;
            </code></pre>

            <p>
                Here, <code>WHERE</code> first filters users whose age is greater
                than 18. Then the users are grouped by city, and
                <code>HAVING</code> keeps only cities having more than 5 users.
            </p>

            <p>
                <strong>Interview shortcut:</strong> WHERE filters rows,
                HAVING filters groups.
            </p>
        `
            },

            {
                question: "What is the difference between DELETE, DROP, and TRUNCATE?",

                answer: `
            <p>
                All three can remove data, but they operate differently.
            </p>

            <ul>
                <li>
                    <strong>DELETE:</strong> Removes selected rows from a table
                    and can use a <code>WHERE</code> condition.
                </li>
                <li>
                    <strong>TRUNCATE:</strong> Removes all rows from a table but
                    keeps the table structure.
                </li>
                <li>
                    <strong>DROP:</strong> Removes the entire table, including
                    its structure and data.
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
DELETE FROM users
WHERE id = 10;

TRUNCATE TABLE users;

DROP TABLE users;
            </code></pre>

            <p>
                <strong>Interview shortcut:</strong>
                DELETE removes rows, TRUNCATE removes all rows while keeping
                the table, and DROP removes the table itself.
            </p>
        `
            },

            {
                question: "What is the difference between UNION and UNION ALL?",

                answer: `
            <p>
                <code>UNION</code> and <code>UNION ALL</code> are used to combine
                the results of multiple <code>SELECT</code> queries.
            </p>

            <ul>
                <li>
                    <strong>UNION:</strong> Combines results and removes duplicate rows.
                </li>
                <li>
                    <strong>UNION ALL:</strong> Combines results without removing
                    duplicates.
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
SELECT city FROM customers
UNION
SELECT city FROM suppliers;

SELECT city FROM customers
UNION ALL
SELECT city FROM suppliers;
            </code></pre>

            <p>
                <code>UNION ALL</code> is generally faster because the database
                does not need to perform duplicate removal.
            </p>

            <p>
                The combined queries must return the same number of columns
                with compatible data types.
            </p>
        `
            },

            {
                question: "What is the difference between INNER JOIN, LEFT JOIN, RIGHT JOIN, and FULL JOIN?",

                answer: `
            <p>
                A <strong>JOIN</strong> combines rows from two or more tables
                based on a related column.
            </p>

            <ul>
                <li>
                    <strong>INNER JOIN:</strong> Returns only rows that have
                    matching values in both tables.
                </li>
                <li>
                    <strong>LEFT JOIN:</strong> Returns all rows from the left
                    table and matching rows from the right table. If there is
                    no match, the right-side columns contain <code>NULL</code>.
                </li>
                <li>
                    <strong>RIGHT JOIN:</strong> Returns all rows from the right
                    table and matching rows from the left table.
                </li>
                <li>
                    <strong>FULL JOIN:</strong> Returns all rows from both tables.
                    Non-matching columns contain <code>NULL</code>.
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
SELECT u.name, o.amount
FROM users u
LEFT JOIN orders o
ON u.id = o.user_id;
            </code></pre>

            <p>
                This returns every user, including users who have not placed
                an order. For users without an order, the order columns will
                contain <code>NULL</code>.
            </p>
        `
            },

            {
                question: "What is a self join?",

                answer: `
            <p>
                A <strong>self join</strong> is a join where a table is joined
                with itself. It is useful when rows in the same table have
                relationships with other rows in that table.
            </p>

            <h4>Example:</h4>

            <p>
                Suppose an employees table contains an employee's manager ID.
                We can use a self join to find each employee's manager.
            </p>

            <pre><code>
SELECT
    e.name AS employee,
    m.name AS manager
FROM employees e
LEFT JOIN employees m
ON e.manager_id = m.id;
            </code></pre>

            <p>
                Here, the table is given two different aliases:
                <code>e</code> represents the employee and <code>m</code>
                represents the manager.
            </p>
        `
            },
            {
                question: "What is a subquery?",

                answer: `
            <p>
                A <strong>subquery</strong> is a query written inside another SQL query.
                It is used when the result of one query is required by another query.
            </p>

            <h4>Example:</h4>

            <pre><code>
SELECT *
FROM employees
WHERE salary &gt; (
    SELECT AVG(salary)
    FROM employees
);
            </code></pre>

            <p>
                Here, the inner query calculates the average salary, and the
                outer query returns employees whose salary is greater than that average.
            </p>

            <p>
                A subquery can be used inside <code>SELECT</code>, <code>FROM</code>,
                or <code>WHERE</code>, depending on the requirement.
            </p>
        `
            },

            {
                question: "What is a correlated subquery?",

                answer: `
            <p>
                A <strong>correlated subquery</strong> is a subquery that depends
                on a value from the outer query. It is logically evaluated for
                each row processed by the outer query.
            </p>

            <h4>Example:</h4>

            <pre><code>
SELECT e1.name, e1.salary, e1.department_id
FROM employees e1
WHERE e1.salary &gt; (
    SELECT AVG(e2.salary)
    FROM employees e2
    WHERE e2.department_id = e1.department_id
);
            </code></pre>

            <p>
                Here, the inner query uses <code>e1.department_id</code> from
                the outer query. Therefore, the average salary is calculated
                separately for each employee's department.
            </p>

            <p>
                <strong>Key difference:</strong> A normal subquery can run
                independently, while a correlated subquery depends on the
                outer query.
            </p>
        `
            },

            {
                question: "What is normalization?",

                answer: `
            <p>
                <strong>Normalization</strong> is the process of organizing data
                in a database to reduce data duplication and improve data
                consistency and integrity.
            </p>

            <p>
                It usually involves dividing large tables into smaller,
                logically related tables and connecting them using keys.
            </p>

            <h4>Main goals:</h4>

            <ul>
                <li>Reduce duplicate data.</li>
                <li>Prevent data inconsistencies.</li>
                <li>Improve data integrity.</li>
                <li>Make database structure easier to maintain.</li>
            </ul>

            <p>
                Normalization is commonly explained using normal forms such as
                <strong>1NF, 2NF, and 3NF</strong>.
            </p>
        `
            },

            {
                question: "What are 1NF, 2NF, and 3NF?",

                answer: `
            <p>
                <strong>1NF, 2NF, and 3NF</strong> are normal forms used to
                organize relational database tables and reduce redundancy.
            </p>

            <h4>1NF — First Normal Form</h4>

            <p>
                A table is in 1NF when each column contains atomic values,
                meaning each cell contains a single value, and there are
                no repeating groups.
            </p>

            <h4>2NF — Second Normal Form</h4>

            <p>
                A table must first be in 1NF, and every non-key column must
                depend on the <strong>entire primary key</strong>, not just
                part of a composite primary key.
            </p>

            <h4>3NF — Third Normal Form</h4>

            <p>
                A table must first be in 2NF, and non-key columns should not
                depend on other non-key columns. In other words, there should
                be no transitive dependency.
            </p>

            <p>
                <strong>Interview shortcut:</strong>
                1NF = atomic values,
                2NF = full dependency on the key,
                3NF = no dependency between non-key columns.
            </p>
        `
            },

            {
                question: "What is denormalization and when would you use it?",

                answer: `
            <p>
                <strong>Denormalization</strong> is the process of intentionally
                adding redundant data or combining related data to reduce the

            {
                question: "What are window functions?",

                answer: `
            <p>
                <strong>Window functions</strong> perform calculations across
                a set of related rows without combining those rows into a
                single result row.
            </p>

            <p>
                Unlike <code>GROUP BY</code>, window functions keep the
                individual rows in the result while adding a calculated value
                such as a rank, running total, or average.
            </p>

            <h4>Common window functions:</h4>

            <ul>
                <li><code>ROW_NUMBER()</code></li>
                <li><code>RANK()</code></li>
                <li><code>DENSE_RANK()</code></li>
                <li><code>SUM()</code></li>
                <li><code>AVG()</code></li>
                <li><code>COUNT()</code></li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
SELECT
    name,
    salary,
    RANK() OVER (ORDER BY salary DESC) AS salary_rank
FROM employees;
            </code></pre>

            <p>
                Here, each employee remains in the result while a salary rank
                is calculated for them.
            </p>
        `

                question: "What is the difference between RANK(), DENSE_RANK(), and ROW_NUMBER()?",

            <p>
                All three functions assign numbers to rows, but they handle
                duplicate values differently.
            </p>

            <ul>
                <li>
                    <strong>ROW_NUMBER():</strong> Gives every row a unique
                    sequential number, even when values are equal.
                </li>
                <li>
                    <strong>RANK():</strong> Gives the same rank to tied values
                    and leaves gaps after a tie.
                </li>
                <li>
                    <strong>DENSE_RANK():</strong> Gives the same rank to tied
                    values but does not leave gaps.
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
salary | ROW_NUMBER | RANK | DENSE_RANK
-------|------------|------|-----------
100000 | 1          | 1    | 1
100000 | 2          | 1    | 1
90000  | 3          | 3    | 2
80000  | 4          | 4    | 3
            </code></pre>

            <p>
                <strong>Interview shortcut:</strong>
                ROW_NUMBER = always unique,
                RANK = gaps after ties,
                DENSE_RANK = no gaps after ties.
            </p>

            <pre><code>

            </p>

            </p>

            <pre><code>

            </p>

                <strong>Interview point:</strong> An index is useful when the
                database can actually use it efficiently; adding indexes to
                every column does not automatically improve performance.
            </p>

                <li>

            </p>

            </p>

                succeed or the changes can be rolled back if something fails.
            </p>

            <h4>Example:</h4>

            <pre><code>
BEGIN;

UPDATE accounts
SET balance = balance - 1000
WHERE id = 1;

UPDATE accounts
SET balance = balance + 1000
WHERE id = 2;

COMMIT;
            </code></pre>

            <p>
                Here, money is transferred between two accounts. Both updates
                should succeed together; otherwise, the transaction should
                be rolled back.
            </p>
        `

                question: "What are ACID properties?",

            <p>
                <strong>ACID</strong> represents four properties that help
                ensure reliable database transactions.
            </p>

            <ul>
                <li>
                    <strong>Atomicity:</strong> A transaction is treated as
                    one unit. Either all operations succeed or none are applied.
                </li>
                <li>
                    <strong>Consistency:</strong> A transaction moves the
                    database from one valid state to another valid state.
                </li>
                <li>
                    <strong>Isolation:</strong> Concurrent transactions should
                    not improperly interfere with each other.
                </li>
                <li>
                    <strong>Durability:</strong> Once a transaction is committed,
                    its changes should survive system failures.
                </li>
            </ul>

            <p>
                <strong>Interview shortcut:</strong>
                Atomicity = all or nothing,
                Consistency = valid state,
                Isolation = transactions are isolated,
                Durability = committed data persists.
            </p>

            <pre><code>

UPDATE accounts

            </code></pre>

            <p>
                <code>COMMIT</code> makes the transaction's changes permanent.
                <code>ROLLBACK</code> returns the affected data to its state
                before the transaction.
            </p>

                question: "What is a database deadlock?",

                A <strong>deadlock</strong> occurs when two or more transactions
                are waiting for each other to release resources, so none of
                them can continue.
            </p>

            <h4>Example scenario:</h4>

            <ul>
                <li>
                    Transaction A locks Row 1 and waits for Row 2.
                </li>
                <li>
                    Transaction B locks Row 2 and waits for Row 1.
                </li>
                <li>
                    Both transactions keep waiting for each other.
                </li>
            </ul>

            <p>
                Database systems can detect deadlocks and typically resolve
                them by aborting or rolling back one of the transactions.
            </p>

            <h4>How to reduce deadlocks:</h4>

            <ul>
                <li>Keep transactions short.</li>
                <li>Access tables and rows in a consistent order.</li>
                <li>Avoid unnecessary locks.</li>
                <li>Use appropriate transaction isolation levels.</li>
            </ul>

            </p>

            <p>
                Creating a database connection repeatedly can be expensive.
                A connection pool improves performance by reusing existing
                connections.
            </p>

            <pre><code>
Application
    ↓
Connection Pool
    ↓
Database Connections
    ↓
Database
            </code></pre>

                When a request needs the database, it gets an available
                connection from the pool. After the query finishes, the
                connection is returned to the pool.
            </p>

            <p>
                Connection pools also commonly limit the maximum number of
                simultaneous database connections.
            </p>

                The view can then be queried like a table:

            <pre><code>

            </code></pre>

            <p>
                <strong>Interview point:</strong> A view provides a reusable

            </p>

                They can be useful for reusable database operations, but many

            </p>

            <h4>Common uses:</h4>

            <p>
                Execution plans are useful for identifying slow queries and finding opportunities for optimization.

            </p>

            <h4>Common optimization techniques:</h4>

            <ul>
                <li>Create appropriate indexes.</li>
                <li>Avoid unnecessary columns such as <code>SELECT *</code>.</li>
                <li>Filter data early using <code>WHERE</code>.</li>
                <li>Use efficient JOIN conditions.</li>
                <li>Analyze queries using execution plans.</li>
                <li>Avoid unnecessary subqueries or expensive operations.</li>
                <li>Retrieve only the required number of rows.</li>
            </ul>

            <p>
                The goal is to reduce execution time, CPU usage, memory usage, and unnecessary disk or network
                operations.
            </p>
        `
            }

        questions.forEach((item, index) => {

            const card =
                document.createElement("div");


            card.className =
                "question-card";


            card.innerHTML = `

                <button
                    class="question-btn"
                    type="button"
                >

                    <span>
                        ${index + 1}. ${item.question}
                    </span>

                    <span class="arrow">
                        ⌄
                    </span>

                </button>


                <div class="answer">

                    ${item.answer}

                </div>

            `;


            const button =
                card.querySelector(".question-btn");


            button.addEventListener("click", () => {

                card.classList.toggle("open");

            });


            container.appendChild(card);

        });


        /* =========================
           MOBILE MENU
        ========================= */

        const menuBtn =
            document.getElementById("menuBtn");


        const mobileMenu =
            document.getElementById("mobileMenu");


        menuBtn.addEventListener("click", () => {

            mobileMenu.classList.toggle("open");


            if (mobileMenu.classList.contains("open")) {

                menuBtn.textContent = "✕";

            } else {

                menuBtn.textContent = "☰";

            }

        });


        /* CLOSE MENU AFTER CLICKING LINK */

        const mobileLinks =
            mobileMenu.querySelectorAll("a");


        mobileLinks.forEach(link => {

            link.addEventListener("click", () => {

                mobileMenu.classList.remove("open");

                menuBtn.textContent = "☰";

            });

        });


        /* =========================
           THEME
        ========================= */

        const themeBtn =
            document.getElementById("themeBtn");


        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeBtn.textContent = "☀";

        }


        themeBtn.addEventListener("click", () => {

            document.body.classList.toggle("dark");


            const isDark =
                document.body.classList.contains("dark");


            localStorage.setItem(
                "theme",
                isDark ? "dark" : "light"
            );


            themeBtn.textContent =
                isDark ? "☀" : "☾";

        });

    </script>
