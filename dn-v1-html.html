<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           THEME VARIABLES
        ========================= */

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;

            --text: #0f172a;
            --muted: #64748b;

            --border: #e2e8f0;

            --accent: #2563eb;
            --accent-soft: #eff6ff;
        }


        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #263449;

            --text: #f8fafc;
            --muted: #94a3b8;

            --border: #334155;

            --accent: #60a5fa;
            --accent-soft: #172554;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: var(--surface);

            border-bottom: 1px solid var(--border);
        }


        .nav-container {
            max-width: 1100px;

            margin: auto;

            padding: 14px 20px;

            display: flex;
            align-items: center;
            gap: 20px;
        }


        /* LOGO */

        .logo {
            color: var(--text);

            text-decoration: none;

            font-size: 18px;
            font-weight: 700;

            white-space: nowrap;
        }


        .logo span {
            color: var(--accent);
        }


        /* DESKTOP NAVIGATION */

        .nav-links {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;
        }


        .nav-links a {
            color: var(--muted);

            text-decoration: none;

            font-size: 14px;

            padding: 8px 10px;

            border-radius: 7px;

            transition: 0.2s;
        }


        .nav-links a:hover {
            background: var(--surface-hover);
            color: var(--text);
        }


        .nav-links a.active {
            background: var(--accent-soft);
            color: var(--accent);
        }


        /* =========================
           NAV ACTIONS
        ========================= */

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /* THEME BUTTON */

        .theme-btn {
            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }


        .theme-btn:hover {
            background: var(--surface-hover);
        }


        /* MOBILE MENU BUTTON */

        .menu-btn {
            display: none;

            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 20px;
        }


        /* =========================
           MOBILE DROPDOWN
        ========================= */

        .mobile-menu {
            display: none;

            max-width: 1100px;

            margin: auto;

            padding: 0 15px 15px;
        }


        .mobile-menu.open {
            display: block;
        }


        .mobile-menu a {
            display: block;

            color: var(--muted);

            text-decoration: none;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 15px;

            transition: 0.2s;
        }


        .mobile-menu a:hover,
        .mobile-menu a.active {
            background: var(--surface-hover);
            color: var(--text);
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 850px;

            margin: auto;

            padding: 70px 20px 100px;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            margin-bottom: 40px;
        }


        .page-header span {
            color: var(--accent);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.5px;
        }


        .page-header h1 {
            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.1;

            margin: 10px 0;

            letter-spacing: -1px;
        }


        .page-header p {
            color: var(--muted);

            line-height: 1.7;

            max-width: 650px;

            font-size: 15px;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {
            width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 12px;

            margin-bottom: 14px;

            overflow: hidden;

            transition:
                border-color 0.2s,
                transform 0.2s;
        }


        .question-card:hover {
            border-color: color-mix(in srgb,
                    var(--accent) 40%,
                    var(--border));
        }


        /* QUESTION BUTTON */

        .question-btn {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 20px;

            border: none;

            background: transparent;

            color: var(--text);

            text-align: left;

            font-family: inherit;

            font-size: 16px;
            font-weight: 600;

            line-height: 1.5;

            cursor: pointer;
        }


        .question-btn:hover {
            background: var(--surface-hover);
        }


        /* ARROW */

        .arrow {
            flex-shrink: 0;

            color: var(--muted);

            font-size: 18px;

            transition: transform 0.2s;
        }


        /* ANSWER */

        .answer {
            display: none;

            padding: 0 20px 20px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;
        }


        .question-card.open .answer {
            display: block;
        }


        .question-card.open .arrow {
            transform: rotate(180deg);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .nav-container {
                padding: 13px 16px;
            }


            .nav-links {
                display: none;
            }


            .menu-btn {
                display: block;
            }


            .nav-actions {
                margin-left: auto;
            }


            main {
                padding-top: 55px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-container {
                padding: 11px 14px;
            }


            .logo {
                font-size: 17px;
            }


            .menu-btn,
            .theme-btn {
                width: 34px;
                height: 34px;
            }


            main {
                padding: 45px 15px 70px;
            }


            .page-header {
                margin-bottom: 30px;
            }


            .page-header span {
                font-size: 11px;
            }


            .page-header h1 {
                font-size: 34px;

                margin-top: 8px;
            }


            .page-header p {
                font-size: 14px;

                line-height: 1.7;
            }


            .question-card {
                border-radius: 10px;

                margin-bottom: 10px;
            }


            .question-btn {
                padding: 16px;

                font-size: 14px;

                gap: 12px;
            }


            .answer {
                padding: 0 16px 17px;

                font-size: 14px;

                line-height: 1.7;
            }


            .arrow {
                font-size: 16px;
            }

        }


        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 380px) {

            .logo {
                font-size: 16px;
            }


            main {
                padding-left: 12px;
                padding-right: 12px;
            }


            .page-header h1 {
                font-size: 30px;
            }


            .question-btn {
                padding: 14px;

                font-size: 13px;
            }


            .answer {
                padding-left: 14px;
                padding-right: 14px;

                font-size: 13px;
            }

        }
    </style>
</head>

    <script>

       const questions = [

    {
        question: "What is HTML and what is HTML5?",
        answer: `
            <p>
                HTML stands for <strong>HyperText Markup Language</strong>.
                It is the standard markup language used to structure the
                content of web pages, such as headings, paragraphs, images,
                links, forms, and tables.
            </p>

            <p>
                HTML5 is the modern version of HTML that introduced new
                semantic elements, multimedia support, better form controls,
                and browser APIs.
            </p>

            <h4>Examples of HTML5 features:</h4>

            <ul>
                <li>Semantic elements like <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;section&gt;</code>, and <code>&lt;article&gt;</code></li>
                <li>Native audio and video using <code>&lt;audio&gt;</code> and <code>&lt;video&gt;</code></li>
                <li>New form input types such as <code>email</code>, <code>date</code>, and <code>number</code></li>
                <li>APIs such as Geolocation, Web Storage, and Canvas</li>
            </ul>

            <p>
                In short, HTML provides the structure of a webpage, while
                HTML5 is the modern standard that provides improved
                structure, multimedia, forms, and browser capabilities.
            </p>
        `
    },

    {
        question: "What is <!DOCTYPE html> and why is it used?",
        answer: `
            <p>
                <code>&lt;!DOCTYPE html&gt;</code> is a declaration that tells
                the browser that the document uses the modern HTML standard.
            </p>

            <p>
                It is placed at the very beginning of an HTML document and
                tells the browser to render the page in <strong>standards mode</strong>
                instead of quirks mode.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
    &lt;head&gt;
        &lt;title&gt;My Page&lt;/title&gt;
    &lt;/head&gt;
    &lt;body&gt;
        &lt;h1&gt;Hello World&lt;/h1&gt;
    &lt;/body&gt;
&lt;/html&gt;</code></pre>

            <p>
                The important point is that <code>&lt;!DOCTYPE html&gt;</code>
                is not an HTML element. It is a document type declaration.
            </p>
        `
    },

    {
        question: "What is the basic structure of an HTML document?",
        answer: `
            <p>
                A basic HTML document contains the
                <code>&lt;!DOCTYPE html&gt;</code> declaration,
                followed by the <code>&lt;html&gt;</code>,
                <code>&lt;head&gt;</code>, and <code>&lt;body&gt;</code>
                sections.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;

&lt;head&gt;
    &lt;meta charset="UTF-8"&gt;
    &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
    &lt;title&gt;My Website&lt;/title&gt;
&lt;/head&gt;

&lt;body&gt;
    &lt;h1&gt;Hello World&lt;/h1&gt;
    &lt;p&gt;Welcome to my website.&lt;/p&gt;
&lt;/body&gt;

&lt;/html&gt;</code></pre>

            <p>
                The <code>&lt;head&gt;</code> contains metadata, the page title,
                stylesheets, and other resources, while the
                <code>&lt;body&gt;</code> contains the visible content of the page.
            </p>
        `
    },

    {
        question: "What is the difference between block-level and inline elements?",
        answer: `
            <p>
                The main difference is how the elements are laid out on the page.
            </p>

            <p>
                <strong>Block-level elements</strong> normally start on a new line
                and take up the available width of their containing block.
            </p>

            <p>
                Examples include <code>&lt;div&gt;</code>,
                <code>&lt;p&gt;</code>, <code>&lt;h1&gt;</code>, and
                <code>&lt;section&gt;</code>.
            </p>

            <p>
                <strong>Inline elements</strong> normally stay within the same
                line and take up only as much width as their content requires.
            </p>

            <p>
                Examples include <code>&lt;span&gt;</code>,
                <code>&lt;a&gt;</code>, <code>&lt;strong&gt;</code>, and
                <code>&lt;em&gt;</code>.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;div&gt;Block 1&lt;/div&gt;
&lt;div&gt;Block 2&lt;/div&gt;

&lt;span&gt;Inline 1&lt;/span&gt;
&lt;span&gt;Inline 2&lt;/span&gt;</code></pre>

            <p>
                So, by default, block elements create a new line, while inline
                elements flow within the same line.
            </p>
        `
    },

    {
        question: "What is the difference between &lt;div&gt; and &lt;span&gt;",
        answer: `
            <p>
                Both <code>&lt;div&gt;</code> and <code>&lt;span&gt;</code> are
                generic, non-semantic elements, but they are mainly used for
                different types of content grouping.
            </p>

            <p>
                <code>&lt;div&gt;</code> is a block-level element by default
                and is commonly used to group larger sections or containers.
            </p>

            <p>
                <code>&lt;span&gt;</code> is an inline element by default and
                is commonly used to group or style a small part of text or
                inline content.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;div class="card"&gt;
    &lt;h2&gt;Product&lt;/h2&gt;
    &lt;p&gt;This is a product card.&lt;/p&gt;
&lt;/div&gt;

&lt;p&gt;
    This is &lt;span class="highlight"&gt;important&lt;/span&gt; text.
&lt;/p&gt;</code></pre>

            <p>
                In short, use <code>&lt;div&gt;</code> for grouping larger
                block-level content and <code>&lt;span&gt;</code> for small
                inline portions of content.
            </p>
        `
    },

    {
        question: "What are semantic HTML elements and why are they important?",
        answer: `
            <p>
                Semantic HTML elements are elements whose names clearly
                describe the meaning and purpose of their content.
            </p>

            <p>
                Examples include <code>&lt;header&gt;</code>,
                <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>,
                <code>&lt;section&gt;</code>, <code>&lt;article&gt;</code>,
                and <code>&lt;footer&gt;</code>.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;header&gt;
    &lt;h1&gt;My Website&lt;/h1&gt;
&lt;/header&gt;

&lt;nav&gt;
    &lt;a href="/"&gt;Home&lt;/a&gt;
    &lt;a href="/about"&gt;About&lt;/a&gt;
&lt;/nav&gt;

&lt;main&gt;
    &lt;article&gt;
        &lt;h2&gt;My Article&lt;/h2&gt;
        &lt;p&gt;Article content...&lt;/p&gt;
    &lt;/article&gt;
&lt;/main&gt;

&lt;footer&gt;
    &lt;p&gt;Copyright 2026&lt;/p&gt;
&lt;/footer&gt;</code></pre>

            <p>
                Semantic HTML is important because it improves
                <strong>accessibility, SEO, code readability, and maintainability</strong>.
                Screen readers and search engines can better understand the
                structure and purpose of the page.
            </p>
        `
    },

    {
        question: "What is the difference between &lt;section&gt;, &lt;article&gt;, and &lt;div&gt;?",
        answer: `
            <p>
                All three can be used to group content, but they communicate
                different meanings.
            </p>

            <p>
                <code>&lt;section&gt;</code> represents a thematic grouping
                of related content, usually with its own heading.
            </p>

            <p>
                <code>&lt;article&gt;</code> represents a self-contained piece
                of content that could potentially be distributed or reused
                independently, such as a blog post, news article, or forum post.
            </p>

            <p>
                <code>&lt;div&gt;</code> has no semantic meaning. It is a
                generic container used mainly when no more meaningful
                semantic element is appropriate.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;section&gt;
    &lt;h2&gt;Latest Posts&lt;/h2&gt;

    &lt;article&gt;
        &lt;h3&gt;Understanding JavaScript Closures&lt;/h3&gt;
        &lt;p&gt;Article content...&lt;/p&gt;
    &lt;/article&gt;
&lt;/section&gt;

&lt;div class="container"&gt;
    &lt;!-- Generic layout container --&gt;
&lt;/div&gt;</code></pre>

            <p>
                A simple way to remember it is:
                <strong>section = related topic, article = independent content,
                div = generic container.</strong>
            </p>
        `
    },

    {
        question: "What is the difference between &lt;strong&gt; and &lt;b&gt;, and &lt;em&gt; and &lt;i&gt;?",
        answer: `
            <p>
                <code>&lt;strong&gt;</code> and <code>&lt;em&gt;</code> are
                semantic elements, while <code>&lt;b&gt;</code> and
                <code>&lt;i&gt;</code> are mainly used for presentational purposes.
            </p>

            <p>
                <code>&lt;strong&gt;</code> indicates that the content has
                strong importance, while <code>&lt;b&gt;</code> simply draws
                attention to the text without indicating extra importance.
            </p>

            <p>
                <code>&lt;em&gt;</code> indicates emphasis, while
                <code>&lt;i&gt;</code> is generally used for text that is
                set apart from the surrounding content, such as technical
                terms, foreign words, or titles.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;p&gt;
    &lt;strong&gt;Warning:&lt;/strong&gt; Save your work.
&lt;/p&gt;

&lt;p&gt;
    This is &lt;b&gt;bold&lt;/b&gt; text for visual emphasis.
&lt;/p&gt;

&lt;p&gt;
    You &lt;em&gt;must&lt;/em&gt; complete this step.
&lt;/p&gt;

&lt;p&gt;
    The term &lt;i&gt;callback&lt;/i&gt; is commonly used in JavaScript.
&lt;/p&gt;</code></pre>

            <p>
                The key difference is that <code>&lt;strong&gt;</code> and
                <code>&lt;em&gt;</code> communicate meaning, while
                <code>&lt;b&gt;</code> and <code>&lt;i&gt;</code> do not
                necessarily add semantic importance or emphasis.
            </p>
        `
    },

    {
        question: "What are void elements in HTML? Give examples.",
        answer: `
            <p>
                Void elements are HTML elements that cannot contain child
                elements and therefore do not have a closing tag.
            </p>

            <p>
                Common examples include:
                <code>&lt;img&gt;</code>,
                <code>&lt;input&gt;</code>,
                <code>&lt;br&gt;</code>,
                <code>&lt;hr&gt;</code>,
                <code>&lt;meta&gt;</code>, and
                <code>&lt;link&gt;</code>.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;img src="profile.jpg" alt="Profile"&gt;

&lt;input type="text" name="username"&gt;

&lt;br&gt;

&lt;hr&gt;

&lt;meta charset="UTF-8"&gt;</code></pre>

            <p>
                A void element should not be written with a separate closing
                tag such as <code>&lt;/img&gt;</code> or
                <code>&lt;/input&gt;</code>.
            </p>
        `
    },

    {
        question: "What is the difference between GET and POST in an HTML form?",
        answer: `
            <p>
                <code>GET</code> and <code>POST</code> are HTTP methods that
                can be used when submitting an HTML form.
            </p>

            <p>
                With <strong>GET</strong>, form data is generally appended to
                the URL as query parameters. It is commonly used when
                retrieving or searching for data.
            </p>

            <p>
                With <strong>POST</strong>, form data is sent in the HTTP
                request body. It is commonly used when submitting data that
                creates or changes something on the server.
            </p>

            <h4>Example:</h4>

            <pre><code>&lt;form action="/search" method="GET"&gt;
    &lt;input type="text" name="query"&gt;
    &lt;button type="submit"&gt;Search&lt;/button&gt;
&lt;/form&gt;

&lt;form action="/users" method="POST"&gt;
    &lt;input type="text" name="username"&gt;
    &lt;button type="submit"&gt;Create User&lt;/button&gt;
&lt;/form&gt;</code></pre>

            <p>
                For example, a GET request might produce a URL like
                <code>/search?query=javascript</code>, while POST data is
                sent in the request body.
            </p>

            <p>
                GET requests are suitable for data retrieval and can be
                bookmarked or cached. POST is generally used when sending
                data to the server, especially when the operation causes a
                server-side change.
            </p>

            <p>
                Also, <strong>POST should not be considered automatically
                secure</strong>. If sensitive data is being transmitted,
                HTTPS is required.
            </p>
        `
    },
    {
        question: "What is the difference between id, class, and name attributes?",
        answer: `
            <p>
                <code>id</code>, <code>class</code>, and <code>name</code> are
                HTML attributes, but they serve different purposes.
            </p>

            <ul>
                <li>
                    <strong>id:</strong> Identifies a specific element uniquely
                    within a page. It is commonly used with CSS, JavaScript,
                    and labels.
                </li>
                <li>
                    <strong>class:</strong> Groups multiple elements so they
                    can share CSS styles or be selected using JavaScript.
                </li>
                <li>
                    <strong>name:</strong> Identifies form controls when their
                    values are submitted to the server.
                </li>

            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeBtn.textContent = "☀";

        }


        themeBtn.addEventListener("click", () => {

            document.body.classList.toggle("dark");


            const isDark =
                document.body.classList.contains("dark");


            localStorage.setItem(
                "theme",
                isDark ? "dark" : "light"
            );


            themeBtn.textContent =
                isDark ? "☀" : "☾";

        });

    </script>


</body>

</html>
