<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="dev-prep-favicon.png">
    <title>React Interview Questions</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           THEME VARIABLES
        ========================= */

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;

            --text: #0f172a;
            --muted: #64748b;

            --border: #e2e8f0;

            --accent: #2563eb;
            --accent-soft: #eff6ff;
        }


        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #263449;

            --text: #f8fafc;
            --muted: #94a3b8;

            --border: #334155;

            --accent: #60a5fa;
            --accent-soft: #172554;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: var(--surface);

            border-bottom: 1px solid var(--border);
        }


        .nav-container {
            max-width: 1100px;

            margin: auto;

            padding: 14px 20px;

            display: flex;
            align-items: center;
            gap: 20px;
        }


        /* LOGO */

        .logo {
            color: var(--text);

            text-decoration: none;

            font-size: 18px;
            font-weight: 700;

            white-space: nowrap;
        }


        .logo span {
            color: var(--accent);
        }


        /* DESKTOP NAVIGATION */

        .nav-links {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;
        }


        .nav-links a {
            color: var(--muted);

            text-decoration: none;

            font-size: 14px;

            padding: 8px 10px;

            border-radius: 7px;

            transition: 0.2s;
        }


        .nav-links a:hover {
            background: var(--surface-hover);
            color: var(--text);
        }


        .nav-links a.active {
            background: var(--accent-soft);
            color: var(--accent);
        }


        /* =========================
           NAV ACTIONS
        ========================= */

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /* THEME BUTTON */

        .theme-btn {
            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }


        .theme-btn:hover {
            background: var(--surface-hover);
        }


        /* MOBILE MENU BUTTON */

        .menu-btn {
            display: none;

            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 20px;
        }


        /* =========================
           MOBILE DROPDOWN
        ========================= */

        .mobile-menu {
            display: none;

            max-width: 1100px;

            margin: auto;

            padding: 0 15px 15px;
        }


        .mobile-menu.open {
            display: block;
        }


        .mobile-menu a {
            display: block;

            color: var(--muted);

            text-decoration: none;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 15px;

            transition: 0.2s;
        }


        .mobile-menu a:hover,
        .mobile-menu a.active {
            background: var(--surface-hover);
            color: var(--text);
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 850px;

            margin: auto;

            padding: 70px 20px 100px;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            margin-bottom: 40px;
        }


        .page-header span {
            color: var(--accent);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.5px;
        }


        .page-header h1 {
            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.1;

            margin: 10px 0;

            letter-spacing: -1px;
        }


        .page-header p {
            color: var(--muted);

            line-height: 1.7;

            max-width: 650px;

            font-size: 15px;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {
            width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 12px;

            margin-bottom: 14px;

            overflow: hidden;

            transition:
                border-color 0.2s,
                transform 0.2s;
        }


        .question-card:hover {
            border-color: color-mix(in srgb,
                    var(--accent) 40%,
                    var(--border));
        }


        /* QUESTION BUTTON */

        .question-btn {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 20px;

            border: none;

            background: transparent;

            color: var(--text);

            text-align: left;

            font-family: inherit;

            font-size: 16px;
            font-weight: 600;

            line-height: 1.5;

            cursor: pointer;
        }


        .question-btn:hover {
            background: var(--surface-hover);
        }


        /* ARROW */

        .arrow {
            flex-shrink: 0;

            color: var(--muted);

            font-size: 18px;

            transition: transform 0.2s;
        }


        /* ANSWER */

        .answer {
            display: none;

            padding: 0 20px 20px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;
        }


        .question-card.open .answer {
            display: block;
        }


        .question-card.open .arrow {
            transform: rotate(180deg);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .nav-container {
                padding: 13px 16px;
            }


            .nav-links {
                display: none;
            }


            .menu-btn {
                display: block;
            }


            .nav-actions {
                margin-left: auto;
            }


            main {
                padding-top: 55px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-container {
                padding: 11px 14px;
            }


            .logo {
                font-size: 17px;
            }


            .menu-btn,
            .theme-btn {
                width: 34px;
                height: 34px;
            }


            main {
                padding: 45px 15px 70px;
            }


            .page-header {
                margin-bottom: 30px;
            }


            .page-header span {
                font-size: 11px;
            }


            .page-header h1 {
                font-size: 34px;

                margin-top: 8px;
            }


            .page-header p {
                font-size: 14px;

                line-height: 1.7;
            }


            .question-card {
                border-radius: 10px;

                margin-bottom: 10px;
            }


            .question-btn {
                padding: 16px;

                font-size: 14px;

                gap: 12px;
            }


            .answer {
                padding: 0 16px 17px;

                font-size: 14px;

                line-height: 1.7;
            }


            .arrow {
                font-size: 16px;
            }

        }


        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 380px) {

            .logo {
                font-size: 16px;
            }


            main {
                padding-left: 12px;
                padding-right: 12px;
            }


            .page-header h1 {
                font-size: 30px;
            }


            .question-btn {
                padding: 14px;

                font-size: 13px;
            }


            .answer {
                padding-left: 14px;
                padding-right: 14px;

                font-size: 13px;
            }

        }
    </style>
</head>

        <header class="page-header">

                React.js
            </h1>

            <p>
                Important React.js concepts and interview
                questions, from fundamentals to advanced topics.
            </p>

        </header>


        <!-- QUESTIONS -->

        <section id="questions"></section>

    <script>


        /* =========================
           QUESTIONS
        ========================= */

        const questions = [

    {
        question: "What is React and why is it used?",

        answer: `
            <p>
                React is a JavaScript library developed by Meta for building
                user interfaces, especially single-page applications (SPAs).
            </p>

            <p>
                React allows developers to build applications using reusable
                components and efficiently update the UI when data changes.
            </p>

            <h4>Why is React used?</h4>

            <ul>
                <li>Component-based architecture</li>
                <li>Reusable UI components</li>
                <li>Efficient UI updates using reconciliation</li>
                <li>Supports building single-page applications</li>
                <li>Large ecosystem and community support</li>
                <li>Easy integration with APIs and other libraries</li>
            </ul>

            <p>
                In simple terms, React helps us build complex and interactive
                user interfaces by breaking them into small, reusable components.
            </p>
        `
    },


    {
        question: "What is JSX and how does it work?",

        answer: `
            <p>
                JSX stands for JavaScript XML. It is a syntax extension for
                JavaScript that allows us to write HTML-like code inside
                JavaScript.
            </p>

            <p>
                JSX makes React components easier to read and write because
                the UI structure can be written directly inside JavaScript.
            </p>

            <h4>Example:</h4>

            <pre><code>
const element = &lt;h1&gt;Hello World&lt;/h1&gt;;
            </code></pre>

            <p>
                JSX is not directly understood by the JavaScript engine.
                Tools such as Babel transform JSX into regular JavaScript
                function calls that React can understand.
            </p>

            <p>
                JSX also allows JavaScript expressions to be embedded using
                curly braces.
            </p>

            <pre><code>
const name = "Pratap";

const element = &lt;h1&gt;Hello, {name}&lt;/h1&gt;;
            </code></pre>
        `
    },


    {
        question: "What are components in React?",

        answer: `
            <p>
                Components are independent and reusable building blocks of a
                React application. A component usually contains the UI,
                logic, and behavior for a particular part of the application.
            </p>

            <p>
                Components can accept data through props and maintain their
                own state when required.
            </p>

            <h4>Example:</h4>

            <pre><code>
function Welcome() {
    return &lt;h1&gt;Welcome to React&lt;/h1&gt;;
}
            </code></pre>

            <p>
                Here, <code>Welcome</code> is a React component that can be
                reused wherever the same UI is required.
            </p>

            <h4>Types of components:</h4>

            <ul>
                <li>Functional components</li>
                <li>Class components</li>
            </ul>

            <p>
                Modern React primarily uses functional components with Hooks.
            </p>
        `
    },


    {
        question: "What is the difference between functional and class components?",

        answer: `
            <p>
                Functional components are JavaScript functions that return
                JSX, while class components are JavaScript classes that extend
                <code>React.Component</code>.
            </p>

            <h4>Functional Component:</h4>

            <pre><code>
function User() {
    return &lt;h1&gt;Hello User&lt;/h1&gt;;
}
            </code></pre>

            <h4>Class Component:</h4>

            <pre><code>
class User extends React.Component {
    render() {
        return &lt;h1&gt;Hello User&lt;/h1&gt;;
    }
}
            </code></pre>

            <h4>Key differences:</h4>

            <ul>
                <li>
                    Functional components are simpler and use Hooks for
                    state and side effects.
                </li>
                <li>
                    Class components use <code>this</code>, lifecycle methods,
                    and class state.
                </li>
                <li>
                    Functional components are the preferred approach in
                    modern React development.
                </li>
            </ul>
        `
    },


    {
        question: "What are props in React?",

        answer: `
            <p>
                Props, short for properties, are read-only data passed from
                a parent component to a child component.
            </p>

            <p>
                Props are used to make components reusable and allow a parent
                component to provide data or behavior to a child.
            </p>

            <h4>Example:</h4>

            <pre><code>
function User({ name }) {
    return &lt;h2&gt;Hello, {name}&lt;/h2&gt;;
}

function App() {
    return &lt;User name="Pratap" /&gt;;
}
            </code></pre>

            <p>
                Here, <code>name</code> is a prop passed from
                <code>App</code> to the <code>User</code> component.
            </p>

            <p>
                Props should not be directly modified by the child component.
                If the data needs to change, the parent should update it and
                pass the new value again.
            </p>
        `
    },


    {
        question: "What is state in React?",

        answer: `
            <p>
                State is data managed by a React component that can change
                over time. When state changes, React re-renders the component
                so that the UI can reflect the latest data.
            </p>

            <h4>Example:</h4>

            <pre><code>
import { useState } from "react";

function Counter() {
    const [count, setCount] = useState(0);

    return (
        &lt;div&gt;
            &lt;p&gt;Count: {count}&lt;/p&gt;

            &lt;button onClick={() =&gt; setCount(count + 1)}&gt;
                Increment
            &lt;/button&gt;
        &lt;/div&gt;
    );
}
            </code></pre>

            <p>
                Here, <code>count</code> is the state value and
                <code>setCount</code> is the function used to update it.
            </p>

            <p>
                State is commonly used for things such as form values,
                counters, loading states, selected items, and UI visibility.
            </p>
        `
    },


    {
        question: "What is the difference between props and state?",

        answer: `
            <p>
                Props and state both store data used by React components, but
                they have different purposes and sources.
            </p>

            <h4>Props</h4>

            <ul>
                <li>Passed from parent to child.</li>
                <li>Read-only for the receiving component.</li>
                <li>Used to pass data or behavior between components.</li>
                <li>Controlled by the parent component.</li>
            </ul>

            <h4>State</h4>

            <ul>
                <li>Managed inside a component.</li>
                <li>Can be updated using a state setter.</li>
                <li>Used for data that changes over time.</li>
                <li>Updating state causes a re-render.</li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
function User({ name }) {
    const [age, setAge] = useState(24);

    return (
        &lt;div&gt;
            &lt;p&gt;Name: {name}&lt;/p&gt;
            &lt;p&gt;Age: {age}&lt;/p&gt;
        &lt;/div&gt;
    );
}
            </code></pre>

            <p>
                In this example, <code>name</code> is a prop received from the
                parent, while <code>age</code> is state managed by the
                <code>User</code> component.
            </p>
        `
    },


    {
        question: "What causes a React component to re-render?",

        answer: `
            <p>
                A React component re-renders when React determines that its
                rendered output may need to be updated.
            </p>

            <h4>Common reasons for a re-render:</h4>

            <ul>
                <li>
                    The component's state is updated.
                </li>
                <li>
                    The component receives new props.
                </li>
                <li>
                    A consumed Context value changes.
                </li>
                <li>
                    Its parent component re-renders, causing the child to
                    be evaluated again.
                </li>
            </ul>

            <p>
                A re-render does not necessarily mean that the actual DOM
                will be changed. React compares the new result with the
                previous result during reconciliation and updates only the
                necessary DOM elements.
            </p>

            <h4>Example:</h4>

            <pre><code>
function Counter() {
    const [count, setCount] = useState(0);

    return (
        &lt;button onClick={() =&gt; setCount(count + 1)}&gt;
            {count}
        &lt;/button&gt;
    );
}
            </code></pre>

            <p>
                When <code>setCount()</code> updates the state, the component
                re-renders with the new value of <code>count</code>.
            </p>
        `
    },


    {
        question: "What is the Virtual DOM?",

        answer: `
            <p>
                The Virtual DOM is an in-memory representation of the UI
                maintained by React. It is a lightweight representation of
                the actual browser DOM.
            </p>

            <p>
                When state or props change, React creates a new representation
                of the UI and compares it with the previous one. React then
                determines the necessary changes and updates the actual DOM.
            </p>

            <h4>Basic flow:</h4>

            <ol>
                <li>State or props change.</li>
                <li>React renders the component again.</li>
                <li>React compares the new UI representation with the previous one.</li>
                <li>React updates the required parts of the actual DOM.</li>
            </ol>

            <p>
                This approach helps React manage UI updates efficiently and
                provides a declarative way to build user interfaces.
            </p>
        `
    },


    {
        question: "What is reconciliation in React?",

        answer: `
            <p>
                Reconciliation is the process React uses to compare the
                previous rendered UI with the new rendered UI and determine
                what needs to be updated.
            </p>

            <p>
                When state or props change, React creates a new element tree.
                It then compares this tree with the previous one and applies
                the required changes to the actual DOM.
            </p>

            <h4>Example:</h4>

            <pre><code>
function App() {
    const [count, setCount] = useState(0);

    return (
        &lt;div&gt;
            &lt;h1&gt;Counter&lt;/h1&gt;
            &lt;p&gt;{count}&lt;/p&gt;
        &lt;/div&gt;
    );
}
            </code></pre>

            <p>
                If <code>count</code> changes from <code>0</code> to
                <code>1</code>, React compares the previous and new UI and
                updates the part that changed instead of rebuilding the
                entire DOM.
            </p>

            <p>
                Keys are especially important during reconciliation when
                React is comparing elements in lists.
            </p>
        `
    },


    {
        question: "What is the purpose of the key prop when rendering lists?",

        answer: `
            <p>
                The <code>key</code> prop gives each element in a React list
                a stable and unique identity. React uses keys during
                reconciliation to determine which list items were added,
                removed, or changed.
            </p>

            <h4>Example:</h4>

            <pre><code>
const users = [
    { id: 1, name: "John" },
    { id: 2, name: "Alex" },
    { id: 3, name: "Sam" }
];

function UserList() {
    return (
        &lt;ul&gt;
            {users.map(user =&gt; (
                &lt;li key={user.id}&gt;
                    {user.name}
                &lt;/li&gt;
            ))}
        &lt;/ul&gt;
    );
}
            </code></pre>

            <p>
                Here, <code>user.id</code> provides a stable identity for
                each list item.
            </p>

            <h4>Why are keys important?</h4>

            <ul>
                <li>Help React identify list elements efficiently.</li>
                <li>Improve reconciliation of dynamic lists.</li>
                <li>Help React preserve the correct component state.</li>
                <li>Prevent unnecessary DOM updates.</li>
            </ul>

            <p>
                Keys should generally be unique and stable among the items
                in the same list.
            </p>
        `
    },
    {
        question: "Why is using array index as a key sometimes problematic?",

        answer: `
            <p>
                Using the array index as a key can be problematic when the
                list can be reordered, inserted into, or deleted from.
                The index can change when the list changes, so React may
                associate the wrong component instance with an item.
            </p>

            <h4>Example:</h4>

            <pre><code>
const users = [
    { id: 101, name: "John" },
    { id: 102, name: "Alex" }
];

{users.map((user, index) =&gt; (
    &lt;User key={index} name={user.name} /&gt;
))}
            </code></pre>

            <p>
                If a new user is inserted at the beginning, the indexes of
                the existing users change. React may then reuse component
                instances for different users.
            </p>

            <p>
                This can cause incorrect UI state, especially when list items
                contain inputs or other stateful components.
            </p>

            <h4>Better approach:</h4>

            <pre><code>
{users.map(user =&gt; (
    &lt;User key={user.id} name={user.name} /&gt;
))}
            </code></pre>

            <p>
                Use a stable and unique identifier such as a database ID
                whenever possible. Using the index is acceptable when the
                list is static and never reordered, inserted into, or deleted
                from.
            </p>
        `
    },


    {
        question: "What is conditional rendering in React?",

        answer: `
            <p>
                Conditional rendering means displaying different UI
                elements based on a condition.
            </p>

            <p>
                React commonly uses JavaScript operators such as
                <code>if</code>, ternary operators, and
                <code>&amp;&amp;</code> for conditional rendering.
            </p>

            <h4>Ternary operator:</h4>

            <pre><code>
function App({ isLoggedIn }) {
    return (
        &lt;div&gt;
            {isLoggedIn
                ? &lt;h1&gt;Welcome User&lt;/h1&gt;
                : &lt;h1&gt;Please Login&lt;/h1&gt;
            }
        &lt;/div&gt;
    );
}
            </code></pre>

            <h4>Using &&:</h4>

            <pre><code>
{isLoggedIn &amp;&amp; &lt;button&gt;Logout&lt;/button&gt;}
            </code></pre>

            <p>

}
            </code></pre>

            <p>Following these rules allows React to maintain the correct order of Hook calls between renders.</p>

            <h4>Incorrect:</h4>
            <pre><code>
function Component({ isLoggedIn }) {
    if (isLoggedIn) {
        const [user, setUser] = useState(null);
    }

    const [count, setCount] = useState(0);
}
            </code></pre>

            <p>If <code>isLoggedIn</code> changes between renders, the number and order of Hook calls can change.</p>

            <h4>Correct:</h4>
            <pre><code>
function Component({ isLoggedIn }) {
    const [user, setUser] = useState(null);
    const [count, setCount] = useState(0);

    if (isLoggedIn) {
        // Use the state here
    }
}
            </code></pre>

            <p>The Hook calls remain at the top level and always execute in the same order.</p>

            <p><strong>Interview answer:</strong> Hooks cannot be called conditionally because React relies on a consistent Hook call order between renders to correctly preserve Hook state.</p>

            <pre><code>
import { StrictMode } from "react";

createRoot(document.getElementById("root")).render(
    &lt;StrictMode&gt;
        &lt;App /&gt;
    &lt;/StrictMode&gt;
);
            </code></pre>

            <p>Strict Mode can help detect issues such as:</p>

            <ul>
                <li>Unexpected side effects</li>
                <li>Impure rendering logic</li>
                <li>Deprecated APIs</li>
                <li>Missing effect cleanup</li>
                <li>Other development-time problems</li>
            </ul>

            <p>Some React behavior may intentionally happen more than once in development under Strict Mode so that unsafe side effects become easier to detect.</p>

            <p><strong>Important:</strong> These development-only checks do not mean that the application performs the same extra work in production.</p>

        question: "What are Error Boundaries in React?",
        answer: `
            <p><strong>Error Boundaries</strong> are React components that catch JavaScript errors occurring during rendering or in certain lifecycle operations in their child component tree and display a fallback UI instead of crashing the entire UI tree.</p>

            <p>Traditionally, Error Boundaries are implemented using class components with <code>getDerivedStateFromError</code> and/or <code>componentDidCatch</code>.</p>

            <h4>Example:</h4>
            <pre><code>
class ErrorBoundary extends React.Component {
    state = {
        hasError: false
    };

    static getDerivedStateFromError() {
        return {
            hasError: true
        };
    }

    componentDidCatch(error, info) {
        console.error(error, info);
    }

    render() {
        if (this.state.hasError) {
            return &lt;h2&gt;Something went wrong.&lt;/h2&gt;;
        }

        return this.props.children;
    }
}
            </code></pre>

            <p>You can then wrap part of the application:</p>

            <pre><code>
&lt;ErrorBoundary&gt;
    &lt;Dashboard /&gt;
&lt;/ErrorBoundary&gt;
            </code></pre>

            <p><strong>Important:</strong> Error Boundaries do not automatically catch errors from event handlers or every kind of asynchronous code. Those errors should be handled separately.</p>

            <p><strong>Hydration</strong> is the process where React attaches its behavior and event handlers to HTML that was already generated on the server.</p>

            <p>It is commonly used with server-side rendering frameworks such as Next.js.</p>

            <h4>Basic Flow:</h4>
            <ol>
                <li>The server generates HTML for the page.</li>
                <li>The browser receives and displays that HTML.</li>
                <li>JavaScript loads in the browser.</li>
                <li>React hydrates the existing HTML and attaches the necessary behavior.</li>
            </ol>

            <p>For example, a server may send:</p>

            <pre><code>
&lt;button&gt;Click me&lt;/button&gt;
            </code></pre>

            <p>After hydration, React can attach the event handling required for that button to become interactive.</p>

            <p><strong>Important:</strong> The server-rendered HTML and the initial client render need to match appropriately. Otherwise, React can report hydration mismatch warnings or errors.</p>
        `

            <h4>Basic Flow:</h4>
            <ol>
                <li>Browser requests a page.</li>
                <li>Server renders the React UI into HTML.</li>
                <li>Server sends the HTML to the browser.</li>
                <li>Browser can display the initial content.</li>
                <li>React JavaScript loads and hydrates the page.</li>
            </ol>

            <p>SSR can provide benefits such as faster initial content display and better handling of pages where search-engine-visible HTML is important.</p>

            <p>Frameworks such as Next.js provide server-rendering capabilities for React applications.</p>

            <p><strong>Important:</strong> SSR does not mean that all React code runs only on the server. Client-side JavaScript can still be required to make interactive UI elements work.</p>
        `

            <h4>CSR:</h4>
            <ul>
                <li>The browser downloads JavaScript.</li>
                <li>React runs in the browser.</li>
                <li>The application renders the UI on the client.</li>
            </ul>

            <h4>SSR:</h4>
            <ul>
                <li>The server generates the initial HTML.</li>
                <li>The browser receives already-rendered HTML.</li>
                <li>React hydrates the HTML to make it interactive.</li>
            </ul>

            <h4>Simple Comparison:</h4>

            <pre><code>
CSR:
Browser
   ↓
JavaScript

React renders UI


SSR:
Browser

Server

   ↓

            </code></pre>

            <p><strong>CSR advantages:</strong></p>
            <ul>
                <li>Simple architecture for many applications</li>
                <li>Rich client-side interactions</li>

                <li>Useful for pages where server-rendered content is beneficial for search engines</li>
            </ul>

            <p><strong>Interview answer:</strong> CSR renders the initial UI primarily in the browser using JavaScript, while SSR generates the initial HTML on the server and then React hydrates it on the client.</p>
        `

        const container =
            document.getElementById("questions");


        questions.forEach((item, index) => {

            const card =
                document.createElement("div");


            card.className =
                "question-card";


            card.innerHTML = `

                <button
                    class="question-btn"
                    type="button"
                >

                    <span>
                        ${index + 1}. ${item.question}
                    </span>

                    <span class="arrow">
                        ⌄
                    </span>

                </button>


                <div class="answer">

                    ${item.answer}

                </div>

            `;


            const button =
                card.querySelector(".question-btn");


            button.addEventListener("click", () => {

                card.classList.toggle("open");

            });


            container.appendChild(card);

        });


        /* =========================
           MOBILE MENU
        ========================= */

        const menuBtn =
            document.getElementById("menuBtn");


        const mobileMenu =
            document.getElementById("mobileMenu");


        menuBtn.addEventListener("click", () => {

            mobileMenu.classList.toggle("open");


            if (mobileMenu.classList.contains("open")) {

                menuBtn.textContent = "✕";

            } else {

                menuBtn.textContent = "☰";

            }

        });


        /* CLOSE MENU AFTER CLICKING LINK */

        const mobileLinks =
            mobileMenu.querySelectorAll("a");


        mobileLinks.forEach(link => {

            link.addEventListener("click", () => {

                mobileMenu.classList.remove("open");

                menuBtn.textContent = "☰";

            });

        });


        /* =========================
           THEME
        ========================= */

        const themeBtn =
            document.getElementById("themeBtn");


        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeBtn.textContent = "☀";

        }


        themeBtn.addEventListener("click", () => {

            document.body.classList.toggle("dark");


            const isDark =
                document.body.classList.contains("dark");


            localStorage.setItem(
                "theme",
                isDark ? "dark" : "light"
            );


            themeBtn.textContent =
                isDark ? "☀" : "☾";

        });

    </script>
