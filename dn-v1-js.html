<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Interview Questions</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           THEME VARIABLES
        ========================= */

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;

            --text: #0f172a;
            --muted: #64748b;

            --border: #e2e8f0;

            --accent: #2563eb;
            --accent-soft: #eff6ff;
        }


        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #263449;

            --text: #f8fafc;
            --muted: #94a3b8;

            --border: #334155;

            --accent: #60a5fa;
            --accent-soft: #172554;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: var(--surface);

            border-bottom: 1px solid var(--border);
        }


        .nav-container {
            max-width: 1100px;

            margin: auto;

            padding: 14px 20px;

            display: flex;
            align-items: center;
            gap: 20px;
        }


        /* LOGO */

        .logo {
            color: var(--text);

            text-decoration: none;

            font-size: 18px;
            font-weight: 700;

            white-space: nowrap;
        }


        .logo span {
            color: var(--accent);
        }


        /* DESKTOP NAVIGATION */

        .nav-links {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;
        }


        .nav-links a {
            color: var(--muted);

            text-decoration: none;

            font-size: 14px;

            padding: 8px 10px;

            border-radius: 7px;

            transition: 0.2s;
        }


        .nav-links a:hover {
            background: var(--surface-hover);
            color: var(--text);
        }


        .nav-links a.active {
            background: var(--accent-soft);
            color: var(--accent);
        }


        /* =========================
           NAV ACTIONS
        ========================= */

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /* THEME BUTTON */

        .theme-btn {
            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }


        .theme-btn:hover {
            background: var(--surface-hover);
        }


        /* MOBILE MENU BUTTON */

        .menu-btn {
            display: none;

            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 20px;
        }


        /* =========================
           MOBILE DROPDOWN
        ========================= */

        .mobile-menu {
            display: none;

            max-width: 1100px;

            margin: auto;

            padding: 0 15px 15px;
        }


        .mobile-menu.open {
            display: block;
        }


        .mobile-menu a {
            display: block;

            color: var(--muted);

            text-decoration: none;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 15px;

            transition: 0.2s;
        }


        .mobile-menu a:hover,
        .mobile-menu a.active {
            background: var(--surface-hover);
            color: var(--text);
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 850px;

            margin: auto;

            padding: 70px 20px 100px;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            margin-bottom: 40px;
        }


        .page-header span {
            color: var(--accent);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.5px;
        }


        .page-header h1 {
            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.1;

            margin: 10px 0;

            letter-spacing: -1px;
        }


        .page-header p {
            color: var(--muted);

            line-height: 1.7;

            max-width: 650px;

            font-size: 15px;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {
            width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 12px;

            margin-bottom: 14px;

            overflow: hidden;

            transition:
                border-color 0.2s,
                transform 0.2s;
        }


        .question-card:hover {
            border-color: color-mix(in srgb,
                    var(--accent) 40%,
                    var(--border));
        }


        /* QUESTION BUTTON */

        .question-btn {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 20px;

            border: none;

            background: transparent;

            color: var(--text);

            text-align: left;

            font-family: inherit;

            font-size: 16px;
            font-weight: 600;

            line-height: 1.5;

            cursor: pointer;
        }


        .question-btn:hover {
            background: var(--surface-hover);
        }


        /* ARROW */

        .arrow {
            flex-shrink: 0;

            color: var(--muted);

            font-size: 18px;

            transition: transform 0.2s;
        }


        /* ANSWER */

        .answer {
            display: none;

            padding: 0 20px 20px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;
        }


        .question-card.open .answer {
            display: block;
        }


        .question-card.open .arrow {
            transform: rotate(180deg);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .nav-container {
                padding: 13px 16px;
            }


            .nav-links {
                display: none;
            }


            .menu-btn {
                display: block;
            }


            .nav-actions {
                margin-left: auto;
            }


            main {
                padding-top: 55px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-container {
                padding: 11px 14px;
            }


            .logo {
                font-size: 17px;
            }


            .menu-btn,
            .theme-btn {
                width: 34px;
                height: 34px;
            }


            main {
                padding: 45px 15px 70px;
            }


            .page-header {
                margin-bottom: 30px;
            }


            .page-header span {
                font-size: 11px;
            }


            .page-header h1 {
                font-size: 34px;

                margin-top: 8px;
            }


            .page-header p {
                font-size: 14px;

                line-height: 1.7;
            }


            .question-card {
                border-radius: 10px;

                margin-bottom: 10px;
            }


            .question-btn {
                padding: 16px;

                font-size: 14px;

                gap: 12px;
            }


            .answer {
                padding: 0 16px 17px;

                font-size: 14px;

                line-height: 1.7;
            }


            .arrow {
                font-size: 16px;
            }

        }


        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 380px) {

            .logo {
                font-size: 16px;
            }


            main {
                padding-left: 12px;
                padding-right: 12px;
            }


            .page-header h1 {
                font-size: 30px;
            }


            .question-btn {
                padding: 14px;

                font-size: 13px;
            }


            .answer {
                padding-left: 14px;
                padding-right: 14px;

                font-size: 13px;
            }

        }
    </style>
</head>

    <script>


        /* =========================
           QUESTIONS
        ========================= */

        const questions = [

{
        question: "What is the difference between var, let, and const?",

        answer: `
            <p>
                <code>var</code>, <code>let</code>, and <code>const</code> are used
                to declare variables in JavaScript, but they differ in scope,
                redeclaration, reassignment, and hoisting behavior.
            </p>

            <h4>Key Differences:</h4>

            <ul>
                <li><code>var</code> is function-scoped and can be redeclared and reassigned.</li>
                <li><code>let</code> is block-scoped and can be reassigned but cannot be redeclared in the same scope.</li>
                <li><code>const</code> is block-scoped and cannot be reassigned or redeclared.</li>
                <li><code>let</code> and <code>const</code> are in the Temporal Dead Zone until their declaration is reached.</li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
var a = 10;
var a = 20; // Allowed

let b = 10;
b = 20;     // Allowed
// let b = 30; // Error

const c = 10;
// c = 20;   // Error
            </code></pre>

            <p>
                In modern JavaScript, <code>let</code> and <code>const</code> are
                generally preferred over <code>var</code>.
            </p>
        `
    },


    {
        question: "What is hoisting in JavaScript?",

        answer: `
            <p>
                Hoisting is JavaScript's behavior where declarations of variables
                and functions are processed before the code is executed.
            </p>

            <p>
                Function declarations are fully hoisted, while <code>var</code>
                declarations are hoisted and initialized with <code>undefined</code>.
                <code>let</code> and <code>const</code> are also hoisted internally,
                but they cannot be accessed before their declaration because they
                are in the Temporal Dead Zone.
            </p>

            <h4>Example:</h4>

            <pre><code>
console.log(a); // undefined
var a = 10;

sayHello(); // "Hello"

function sayHello() {
    console.log("Hello");
}
            </code></pre>

            <p>
                Here, the <code>var</code> declaration is available before its
                assignment, while the function declaration can be called before
                it appears in the code.
            </p>
        `
    },


    {
        question: "What is the Temporal Dead Zone (TDZ)?",

        answer: `
            <p>
                The Temporal Dead Zone (TDZ) is the period between entering a
                block and reaching the declaration of a <code>let</code> or
                <code>const</code> variable.
            </p>

            <p>
                During this period, the variable exists but cannot be accessed.
                Trying to access it results in a <code>ReferenceError</code>.
            </p>

            <h4>Example:</h4>

            <pre><code>
console.log(name); // ReferenceError

let name = "John";
            </code></pre>

            <p>
                The TDZ ends when execution reaches the declaration
                <code>let name = "John"</code>.
            </p>
        `
    },


    {
        question: "What is the difference between == and ===?",

        answer: `
            <p>
                <code>==</code> is the loose equality operator. It compares
                values after performing type conversion when necessary.
            </p>

            <p>
                <code>===</code> is the strict equality operator. It compares
                both the value and the data type without performing implicit
                type conversion.
            </p>

            <h4>Example:</h4>

            <pre><code>
console.log(5 == "5");  // true
console.log(5 === "5"); // false
            </code></pre>

            <p>
                In most cases, <code>===</code> is preferred because it avoids
                unexpected results caused by automatic type conversion.
            </p>
        `
    },


    {
        question: "What are primitive and non-primitive data types?",

        answer: `
            <p>
                JavaScript data types can broadly be divided into primitive
                and non-primitive types.
            </p>

            <h4>Primitive Data Types:</h4>

            <p>
                Primitive values are basic, immutable values. JavaScript has
                seven primitive data types:
            </p>

            <ul>
                <li><code>string</code></li>
                <li><code>number</code></li>
                <li><code>bigint</code></li>
                <li><code>boolean</code></li>
                <li><code>undefined</code></li>
                <li><code>null</code></li>
                <li><code>symbol</code></li>
            </ul>

            <h4>Non-Primitive Data Types:</h4>

            <p>
                Non-primitive values are objects and can contain multiple
                values or properties.
            </p>

            <ul>
                <li>Object</li>
                <li>Array</li>
                <li>Function</li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
let name = "John";           // Primitive

let user = {                 // Non-primitive
    name: "John",
    age: 25
};

let numbers = [1, 2, 3];     // Non-primitive
            </code></pre>

            <p>
                A key difference is that primitive values are copied by value,
                while objects are handled through references.
            </p>
        `
    },


    {
        question: "What is the difference between null and undefined?",

        answer: `
            <p>
                <code>undefined</code> means a variable has been declared but
                has not been assigned a value.
            </p>

            <p>
                <code>null</code> represents an intentional absence of a value.
                It is explicitly assigned when we want to indicate that there
                is currently no value.
            </p>

            <h4>Example:</h4>

            <pre><code>
let a;
console.log(a); // undefined

let user = null;
console.log(user); // null
            </code></pre>

            <p>
                In simple terms, <code>undefined</code> usually means
                <strong>"no value has been assigned"</strong>, while
                <code>null</code> means <strong>"intentionally no value"</strong>.
            </p>
        `
    },


    {
        question: "What are truthy and falsy values?",

        answer: `
            <p>
                In JavaScript, every value can be evaluated as either
                <strong>truthy</strong> or <strong>falsy</strong> in a boolean
                context such as an <code>if</code> condition.
            </p>

            <h4>Falsy Values:</h4>

            <p>
                The main falsy values are:
            </p>

            <ul>
                <li><code>false</code></li>
                <li><code>0</code></li>
                <li><code>-0</code></li>
                <li><code>0n</code></li>
                <li><code>""</code></li>
                <li><code>null</code></li>
                <li><code>undefined</code></li>
                <li><code>NaN</code></li>
            </ul>

            <p>
                Every other JavaScript value is truthy.
            </p>

            <h4>Example:</h4>

            <pre><code>
if ("hello") {
    console.log("Truthy");
}

if (0) {
    console.log("This will not execute");
}
            </code></pre>

            <p>
                Truthy and falsy values are commonly used in conditions,
                logical operators, and default-value checks.
            </p>
        `
    },


    {
        question: "What is scope in JavaScript?",

        answer: `
            <p>
                Scope determines where a variable can be accessed in JavaScript.
                In other words, it defines the visibility and accessibility of
                variables.
            </p>

            <h4>Main Types of Scope:</h4>

            <ul>
                <li><strong>Global Scope:</strong> A variable can be accessed from most parts of the program.</li>
                <li><strong>Function Scope:</strong> A variable declared inside a function can only be accessed within that function.</li>
                <li><strong>Block Scope:</strong> Variables declared with <code>let</code> and <code>const</code> are accessible only inside the block where they are declared.</li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
let global = "I am global";

function test() {
    let message = "I am inside function";

    if (true) {
        let blockValue = "I am inside block";
        console.log(blockValue);
    }

    console.log(message);
}

test();

console.log(global);
            </code></pre>

            <p>
                Understanding scope is important because it controls where
                variables can be accessed and prevents unwanted variable conflicts.
            </p>
        `
    },


    {
        question: "What is lexical scope?",

        answer: `
            <p>
                Lexical scope means that the accessibility of a variable is
                determined by where the code is written in the source code,
                not by where the function is called.
            </p>

            <p>
                An inner function can access variables from its outer scope,
                but the outer scope cannot directly access variables declared
                inside the inner scope.
            </p>

            <h4>Example:</h4>

            <pre><code>
function outer() {
    let message = "Hello";

    function inner() {
        console.log(message);
    }

    inner();
}

outer();
            </code></pre>

            <p>
                Here, <code>inner()</code> can access <code>message</code>
                because it was defined inside the lexical scope of
                <code>outer()</code>.
            </p>

            <p>
                Lexical scope is also the foundation for understanding
                <strong>closures</strong>.
            </p>
        `
    },


    {
        question: "What is a closure in JavaScript?",

        answer: `
            <p>
                A closure is created when a function remembers and can access
                variables from its outer lexical scope even after the outer
                function has finished executing.
            </p>

            <h4>Example:</h4>

            <pre><code>
function counter() {
    let count = 0;

    return function () {
        count++;
        return count;
    };
}

const increment = counter();

console.log(increment()); // 1
console.log(increment()); // 2
            </code></pre>

            <p>
                Here, the returned function still has access to the
                <code>count</code> variable even though <code>counter()</code>
                has already finished executing.
            </p>

            <p>
                Closures are commonly used for data privacy, state management,
                callbacks, and functions that need to remember previous values.
            </p>
        `
    },
    {
        question: "What is the difference between a function declaration and function expression?",

        answer: `
            <p>
                A <strong>function declaration</strong> defines a function using
                the <code>function</code> keyword with a function name.
                A <strong>function expression</strong> stores a function inside
                a variable.
            </p>

            <p>
                The main difference is that function declarations are fully
                hoisted, so they can be called before they are defined.
                Function expressions cannot be used before the assignment.
            </p>

            <h4>Example:</h4>

            <pre><code>
// Function Declaration
sayHello();

function sayHello() {
    console.log("Hello");
}

// Function Expression
const greet = function () {
    console.log("Hi");
};

greet();
            </code></pre>
        `
    },


    {
        question: "What is the difference between regular functions and arrow functions?",

        answer: `
            <p>
                Regular functions and arrow functions are both used to create
                functions, but they differ mainly in how they handle
                <code>this</code>, <code>arguments</code>, and constructors.
            </p>

            <ul>
                <li>Arrow functions do not have their own <code>this</code>; they inherit it from the surrounding scope.</li>
                <li>Regular functions have their own <code>this</code>, determined by how the function is called.</li>
                <li>Arrow functions do not have their own <code>arguments</code> object.</li>
                <li>Arrow functions cannot be used as constructors with <code>new</code>.</li>
                <li>Arrow functions have shorter syntax.</li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
const user = {
    name: "John",

    regular: function () {
        console.log(this.name);
    },

    arrow: () =&gt; {
        console.log(this.name);
    }
};

user.regular(); // John
user.arrow();   // undefined
            </code></pre>

            <p>
                Arrow functions are especially common in React callbacks and
                array methods such as <code>map()</code> and
                <code>filter()</code>.
            </p>
        `
    },


    {
        question: "What is the this keyword and how does it work?",

        answer: `
            <p>
                <code>this</code> is a special keyword that refers to the
                object associated with the current function execution.
                Its value depends on <strong>how the function is called</strong>.
            </p>

            <h4>Common Cases:</h4>

            <ul>
                <li>In an object method, <code>this</code> usually refers to the object.</li>
                <li>In a regular function, <code>this</code> depends on the calling context.</li>
                <li>In an arrow function, <code>this</code> is inherited from the surrounding lexical scope.</li>
                <li>With <code>call()</code>, <code>apply()</code>, or <code>bind()</code>, the <code>this</code> value can be explicitly controlled for regular functions.</li>
            </ul>

            <h4>Example:</h4>

            <pre><code>
const user = {
    name: "John",

    greet: function () {
        console.log(this.name);
    }
};

user.greet(); // John
            </code></pre>

            <p>
                Here, <code>this</code> refers to the <code>user</code> object
                because <code>greet()</code> is called as a method of
                <code>user</code>.
            </p>
        `
    },


    {
        question: "What are callback functions?",

        answer: `
            <p>
                A callback function is a function that is passed as an argument
                to another function and is executed later by that function.
            </p>

            <p>
                Callbacks are commonly used for asynchronous operations,
                event handling, and array methods.
            </p>

            <h4>Example:</h4>

            <pre><code>
function greet(name, callback) {
    console.log("Hello " + name);
    callback();
}

function done() {
    console.log("Done!");
}

greet("John", done);
            </code></pre>

            <p>
                Here, <code>done</code> is passed as a callback and is executed
                inside the <code>greet()</code> function.
            </p>
        `
    },


    {
        question: "What are higher-order functions?",

        answer: `
            <p>
                A higher-order function is a function that either
                <strong>takes another function as an argument</strong>,

                <code>first()</code>.
            </p>

                condition, the Call Stack can become full and cause a

                <li><strong>Target phase:</strong> Event reaches the target element.</li>
                <li><strong>Bubbling phase:</strong> Event travels back up through the ancestors.</li>
            </ol>

            <h4>Example:</h4>

            <pre><code>
parent.addEventListener("click", () =&gt; {
    console.log("Parent");
}, true);

child.addEventListener("click", () =&gt; {
    console.log("Child");
});

// Parent
// Child
            </code></pre>

            <p>
                Passing <code>true</code> as the third argument makes the
                listener run during the capturing phase.
                The same can be written more explicitly using
                <code>{ capture: true }</code>.
            </p>
        `

                event and can determine which child triggered it using

});

                elements are dynamically added to the DOM.
            </p>

            </code></pre>

}

            </p>

            </p>

            <p>
                Memoization is an optimization technique where the result of
                an expensive function call is cached so that the same input
                can return the stored result instead of calculating it again.
            </p>

            <h4>Example:</h4>

            <pre><code>
function memoize(fn) {
    const cache = {};

    return function (num) {
        if (num in cache) {
            return cache[num];
        }

        const result = fn(num);
        cache[num] = result;

        return result;
    };
}

const square = memoize(num =&gt; num * num);

console.log(square(5)); // 25
console.log(square(5)); // 25 from cache
            </code></pre>

            <p>
                Memoization can improve performance when a function is called
                repeatedly with the same inputs, although storing cached values
                also consumes memory.
            </p>
        `

        questions.forEach((item, index) => {

            const card =
                document.createElement("div");


            card.className =
                "question-card";


             card.innerHTML = `

                <button
                    class="question-btn"
                    type="button"
                >

                    <span>
                        ${index + 1}. ${item.question}

                    </span>

                <div class="answer">

                    ${item.answer}

                </div>

                card.querySelector(".question-btn");

                card.classList.toggle("open");

            });


            container.appendChild(card);

        });


        /* =========================
           MOBILE MENU
        ========================= */

        const menuBtn =
            document.getElementById("menuBtn");


        const mobileMenu =
            document.getElementById("mobileMenu");


        menuBtn.addEventListener("click", () => {

            mobileMenu.classList.toggle("open");


            if (mobileMenu.classList.contains("open")) {

                menuBtn.textContent = "✕";

            } else {

                menuBtn.textContent = "☰";

            }

        });


        /* CLOSE MENU AFTER CLICKING LINK */

        const mobileLinks =
            mobileMenu.querySelectorAll("a");


        mobileLinks.forEach(link => {

            link.addEventListener("click", () => {

                mobileMenu.classList.remove("open");

                menuBtn.textContent = "☰";

            });

        });


        /* =========================
           THEME
        ========================= */

        const themeBtn =
            document.getElementById("themeBtn");


        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeBtn.textContent = "☀";

        }


        themeBtn.addEventListener("click", () => {

            document.body.classList.toggle("dark");


            const isDark =
                document.body.classList.contains("dark");


            localStorage.setItem(
                "theme",
                isDark ? "dark" : "light"
            );


            themeBtn.textContent =
                isDark ? "☀" : "☾";

        });

    </script>
