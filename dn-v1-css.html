<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="dev-prep-favicon.png">
    <title>Css Interview Questions</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           THEME VARIABLES
        ========================= */

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;

            --text: #0f172a;
            --muted: #64748b;

            --border: #e2e8f0;

            --accent: #2563eb;
            --accent-soft: #eff6ff;
        }


        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #263449;

            --text: #f8fafc;
            --muted: #94a3b8;

            --border: #334155;

            --accent: #60a5fa;
            --accent-soft: #172554;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: var(--surface);

            border-bottom: 1px solid var(--border);
        }


        .nav-container {
            max-width: 1100px;

            margin: auto;

            padding: 14px 20px;

            display: flex;
            align-items: center;
            gap: 20px;
        }


        /* LOGO */

        .logo {
            color: var(--text);

            text-decoration: none;

            font-size: 18px;
            font-weight: 700;

            white-space: nowrap;
        }


        .logo span {
            color: var(--accent);
        }


        /* DESKTOP NAVIGATION */

        .nav-links {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;
        }


        .nav-links a {
            color: var(--muted);

            text-decoration: none;

            font-size: 14px;

            padding: 8px 10px;

            border-radius: 7px;

            transition: 0.2s;
        }


        .nav-links a:hover {
            background: var(--surface-hover);
            color: var(--text);
        }


        .nav-links a.active {
            background: var(--accent-soft);
            color: var(--accent);
        }


        /* =========================
           NAV ACTIONS
        ========================= */

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /* THEME BUTTON */

        .theme-btn {
            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }


        .theme-btn:hover {
            background: var(--surface-hover);
        }


        /* MOBILE MENU BUTTON */

        .menu-btn {
            display: none;

            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 20px;
        }


        /* =========================
           MOBILE DROPDOWN
        ========================= */

        .mobile-menu {
            display: none;

            max-width: 1100px;

            margin: auto;

            padding: 0 15px 15px;
        }


        .mobile-menu.open {
            display: block;
        }


        .mobile-menu a {
            display: block;

            color: var(--muted);

            text-decoration: none;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 15px;

            transition: 0.2s;
        }


        .mobile-menu a:hover,
        .mobile-menu a.active {
            background: var(--surface-hover);
            color: var(--text);
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 850px;

            margin: auto;

            padding: 70px 20px 100px;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            margin-bottom: 40px;
        }


        .page-header span {
            color: var(--accent);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.5px;
        }


        .page-header h1 {
            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.1;

            margin: 10px 0;

            letter-spacing: -1px;
        }


        .page-header p {
            color: var(--muted);

            line-height: 1.7;

            max-width: 650px;

            font-size: 15px;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {
            width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 12px;

            margin-bottom: 14px;

            overflow: hidden;

            transition:
                border-color 0.2s,
                transform 0.2s;
        }


        .question-card:hover {
            border-color: color-mix(in srgb,
                    var(--accent) 40%,
                    var(--border));
        }


        /* QUESTION BUTTON */

        .question-btn {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 20px;

            border: none;

            background: transparent;

            color: var(--text);

            text-align: left;

            font-family: inherit;

            font-size: 16px;
            font-weight: 600;

            line-height: 1.5;

            cursor: pointer;
        }


        .question-btn:hover {
            background: var(--surface-hover);
        }


        /* ARROW */

        .arrow {
            flex-shrink: 0;

            color: var(--muted);

            font-size: 18px;

            transition: transform 0.2s;
        }


        /* ANSWER */

        .answer {
            display: none;

            padding: 0 20px 20px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;
        }


        .question-card.open .answer {
            display: block;
        }


        .question-card.open .arrow {
            transform: rotate(180deg);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .nav-container {
                padding: 13px 16px;
            }


            .nav-links {
                display: none;
            }


            .menu-btn {
                display: block;
            }


            .nav-actions {
                margin-left: auto;
            }


            main {
                padding-top: 55px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-container {
                padding: 11px 14px;
            }


            .logo {
                font-size: 17px;
            }


            .menu-btn,
            .theme-btn {
                width: 34px;
                height: 34px;
            }


            main {
                padding: 45px 15px 70px;
            }


            .page-header {
                margin-bottom: 30px;
            }


            .page-header span {
                font-size: 11px;
            }


            .page-header h1 {
                font-size: 34px;

                margin-top: 8px;
            }


            .page-header p {
                font-size: 14px;

                line-height: 1.7;
            }


            .question-card {
                border-radius: 10px;

                margin-bottom: 10px;
            }


            .question-btn {
                padding: 16px;

                font-size: 14px;

                gap: 12px;
            }


            .answer {
                padding: 0 16px 17px;

                font-size: 14px;

                line-height: 1.7;
            }


            .arrow {
                font-size: 16px;
            }

        }


        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 380px) {

            .logo {
                font-size: 16px;
            }


            main {
                padding-left: 12px;
                padding-right: 12px;
            }


            .page-header h1 {
                font-size: 30px;
            }


            .question-btn {
                padding: 14px;

                font-size: 13px;
            }


            .answer {
                padding-left: 14px;
                padding-right: 14px;

                font-size: 13px;
            }

        }
    </style>
</head>

    <script>


        /* =========================
           QUESTIONS
        ========================= */

        const questions = [

    {
        question: "What is CSS and what are the different ways to apply CSS?",
        answer: `
            <p>
                CSS stands for <strong>Cascading Style Sheets</strong>.
                It is used to control the presentation and layout of HTML
                elements, such as colors, fonts, spacing, positioning,
                responsiveness, and animations.
            </p>

            <p>
                There are three main ways to apply CSS:
            </p>

            <ol>
                <li>
                    <strong>Inline CSS:</strong> CSS is written directly
                    inside the <code>style</code> attribute of an element.
                </li>

                <li>
                    <strong>Internal CSS:</strong> CSS is written inside a
                    <code>&lt;style&gt;</code> element in the HTML document.
                </li>

                <li>
                    <strong>External CSS:</strong> CSS is written in a
                    separate <code>.css</code> file and linked using
                    <code>&lt;link&gt;</code>.
                </li>
            </ol>

            <h4>Examples:</h4>

            <pre><code>&lt;!-- Inline --&gt;
&lt;p style="color: red;"&gt;
    Hello
&lt;/p&gt;

&lt;!-- Internal --&gt;
&lt;style&gt;
    p {
        color: blue;
    }
&lt;/style&gt;

&lt;!-- External --&gt;
&lt;link rel="stylesheet" href="style.css"&gt;</code></pre>

            <p>
                In real-world projects, external CSS is generally preferred
                because it separates styling from HTML and makes styles easier
                to maintain and reuse.
            </p>
        `
    },

    {
        question: "What is the CSS Box Model?",
        answer: `
            <p>
                The CSS Box Model describes how the browser calculates the
                size and spacing of every element.
            </p>

            <p>
                Every element is treated as a rectangular box consisting of
                four parts:
            </p>

            <ol>
                <li><strong>Content:</strong> The actual text, image, or other content.</li>
                <li><strong>Padding:</strong> Space between the content and the border.</li>
                <li><strong>Border:</strong> The boundary around the padding and content.</li>
                <li><strong>Margin:</strong> Space outside the border that separates the element from other elements.</li>
            </ol>

            <h4>Example:</h4>

            <pre><code>.box {
    width: 200px;
    padding: 20px;
    border: 5px solid black;
    margin: 10px;
}</code></pre>

            <p>
                With the default <code>box-sizing: content-box</code>, the
                declared width represents only the content width.
            </p>

            <p>
                So the total width in this example is:
            </p>

            <pre><code>Content = 200px
Padding = 20px + 20px
Border  = 5px + 5px

Total width = 250px</code></pre>

            <p>
                Margin is outside the element's box and is not included in
                the element's calculated width.
            </p>
        `
    },

    {
        question: "What is the difference between box-sizing: content-box and box-sizing: border-box?",
        answer: `
            <p>
                The <code>box-sizing</code> property determines how the
                browser calculates an element's width and height.
            </p>

            <p>
                With <strong>content-box</strong>, the declared
                <code>width</code> and <code>height</code> apply only to the
                content. Padding and border are added to the declared size.
            </p>

            <p>
                With <strong>border-box</strong>, the declared
                <code>width</code> and <code>height</code> include the
                content, padding, and border.
            </p>

            <h4>Example:</h4>

            <pre><code>.box {
    width: 200px;
    padding: 20px;
    border: 5px solid black;
}</code></pre>

            <p>
                With <code>content-box</code>:
            </p>

            <pre><code>Total width =
200px + 40px padding + 10px border
= 250px</code></pre>

            <p>
                With <code>border-box</code>:
            </p>

            <pre><code>Total width = 200px</code></pre>

            <p>
                A common practice is to use:
            </p>

            <pre><code>* {
    box-sizing: border-box;
}</code></pre>

            <p>
                This makes sizing more predictable because the declared width
                includes padding and borders.
            </p>
        `
    },

    {
        question: "What is the difference between Flexbox and CSS Grid?",
        answer: `
            <p>
                Flexbox and CSS Grid are both CSS layout systems, but they
                are designed for different types of layouts.
            </p>

            <p>
                <strong>Flexbox</strong> is primarily a one-dimensional layout
                system. It is useful for arranging elements along a row or
                a column.
            </p>

            <p>
                <strong>CSS Grid</strong> is a two-dimensional layout system.
                It allows you to control both rows and columns at the same time.
            </p>

            <h4>Flexbox example:</h4>

            <pre><code>.container {
    display: flex;
    gap: 20px;
}</code></pre>

            <p>
                This is useful for layouts such as navigation bars, button
                groups, or horizontally aligned cards.
            </p>

            <h4>Grid example:</h4>

            <pre><code>.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}</code></pre>

            <p>
                This is useful for layouts such as dashboards, product grids,
                and complex page structures.
            </p>

            <p>
                In short:
                <strong>Flexbox is mainly one-dimensional, while Grid is
                two-dimensional.</strong>
            </p>
        `
    },

    {
        question: "Explain the main concepts of Flexbox.",
        answer: `
            <p>
                Flexbox is a CSS layout system used to arrange elements
                efficiently in a row or column.
            </p>

            <p>
                First, we make an element a flex container using:
            </p>

            <pre><code>.container {
    display: flex;
}</code></pre>

            <h4>Main Flexbox properties:</h4>

            <ul>
                <li>
                    <strong>flex-direction:</strong> Determines whether items
                    are arranged in a row or column.
                </li>

                <li>
                    <strong>justify-content:</strong> Controls the alignment
                    of items along the main axis.
                </li>

                <li>
                    <strong>align-items:</strong> Controls alignment along
                    the cross axis.
                </li>

                <li>
                    <strong>flex-wrap:</strong> Determines whether items can
                    move onto multiple lines.
                </li>

                <li>
                    <strong>gap:</strong> Creates consistent spacing between
                    flex items.
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>.container {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}</code></pre>

            <p>
                Flexbox is especially useful for navigation bars, card layouts,
                buttons, and aligning elements horizontally or vertically.
            </p>
        `
    },

    {
        question: "What is the difference between justify-content and align-items?",
        answer: `
            <p>
                Both properties are used to align items inside a flex
                container, but they work on different axes.
            </p>

            <p>
                <code>justify-content</code> controls alignment along the
                <strong>main axis</strong>.
            </p>

            <p>
                <code>align-items</code> controls alignment along the
                <strong>cross axis</strong>.
            </p>

            <p>
                For the default
                <code>flex-direction: row</code>:
            </p>

            <ul>
                <li>
                    Main axis = horizontal
                </li>
                <li>
                    Cross axis = vertical
                </li>
            </ul>

            <h4>Example:</h4>

            <pre><code>.container {
    display: flex;
    justify-content: center;
    align-items: center;
}</code></pre>

            <p>
                Here, <code>justify-content: center</code> centers the items
                horizontally, while <code>align-items: center</code> centers
                them vertically.
            </p>

            <p>
                If <code>flex-direction</code> changes to
                <code>column</code>, the axes also change. Therefore,
                <code>justify-content</code> and <code>align-items</code>
                should be understood in terms of the main and cross axes,
                rather than simply horizontal and vertical alignment.
            </p>
        `
    },

    {
        question: "How do you center an element horizontally and vertically using Flexbox?",
        answer: `
            <p>
                We can center an element both horizontally and vertically by
                making its parent a flex container and using
                <code>justify-content: center</code> and
                <code>align-items: center</code>.
            </p>

            <h4>Example:</h4>

            <pre><code>.container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}</code></pre>

            <p>
                Here, <code>justify-content: center</code> centers the child
                along the main axis, while
                <code>align-items: center</code> centers it along the cross
                axis.
            </p>

            <p>
                With the default <code>flex-direction: row</code>, this means
                horizontal and vertical centering respectively.
            </p>

            <h4>Example HTML:</h4>

            <pre><code>&lt;div class="container"&gt;
    &lt;div class="box"&gt;
        Centered Content
    &lt;/div&gt;
&lt;/div&gt;</code></pre>
        `
    },

    {
        question: "What is CSS Grid and how does grid-template-columns work?",
        answer: `
            <p>
                CSS Grid is a two-dimensional layout system that allows us to
                arrange elements into rows and columns.
            </p>

            <p>
                We create a grid container using:
            </p>

            <pre><code>.container {
    display: grid;
}</code></pre>

            <p>
                The <code>grid-template-columns</code> property defines the
                number and size of the columns in the grid.
            </p>

            <h4>Example:</h4>

            <pre><code>.container {
    display: grid;
    grid-template-columns: 200px 200px 200px;
}</code></pre>

            <p>
                This creates three columns, each 200px wide.
            </p>

            <p>
                We can also use the <code>fr</code> unit to divide the
                available space proportionally:
            </p>

            <pre><code>.container {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
}</code></pre>

            <p>
                Here, the available space is divided into four equal parts:
                the first column gets one part, the second gets two parts,
                and the third gets one part.
            </p>

            <p>
                A common approach for responsive grids is:
            </p>

            <pre><code>.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}</code></pre>

            <p>
                This creates three equal-width columns with a 20px gap.
            </p>
        `
    },

    {
        question: "What is CSS specificity? How is specificity calculated?",
        answer: `
            <p>
                CSS specificity is the system browsers use to determine which
                CSS rule should be applied when multiple rules target the same
                element.
            </p>

            <p>
                Specificity is generally compared in this order:
            </p>

            <ol>
                <li><strong>Inline styles</strong> have very high specificity.</li>
                <li><strong>ID selectors</strong> are more specific than classes.</li>
                <li><strong>Class, attribute, and pseudo-class selectors</strong> are less specific than IDs.</li>
                <li><strong>Element and pseudo-element selectors</strong> have lower specificity.</li>
            </ol>

            <h4>Example:</h4>

            <pre><code>p {
    color: blue;
}

.text {
    color: green;
}

#title {
    color: red;
}</code></pre>

            <pre><code>&lt;p id="title" class="text"&gt;
    Hello
&lt;/p&gt;</code></pre>

            <p>
                All three selectors target the paragraph, but the ID selector
                is more specific than the class and element selectors, so the
                text will be red.
            </p>

            <h4>Specificity is commonly represented as:</h4>

            <pre><code>Inline styles → IDs → Classes/Attributes/Pseudo-classes → Elements</code></pre>

            <p>
                If two rules have the same specificity, the rule that appears
                later in the stylesheet generally wins, assuming they are in
                the same cascade context.
            </p>

            <p>
                The <code>!important</code> flag changes the normal cascade
                and should generally be avoided unless there is a specific
                reason to use it.
            </p>
        `
    },

    {
        question: "What is the difference between position: relative, absolute, fixed, and sticky?",
        answer: `
            <p>
                The CSS <code>position</code> property controls how an element
                is positioned in the document.
            </p>

            <h4>1. relative</h4>

            <p>
                <code>position: relative</code> keeps the element in the normal
                document flow but allows it to be visually moved using
                <code>top</code>, <code>right</code>, <code>bottom</code>,
                or <code>left</code>.
            </p>

            <p>
                It also commonly acts as the positioning reference for an
                absolutely positioned child.
            </p>

            <pre><code>.parent {
    position: relative;
}

.child {
    position: absolute;
    top: 0;
    right: 0;
}</code></pre>

            <h4>2. absolute</h4>

            <p>
                <code>position: absolute</code> removes the element from the
                normal document flow. It is positioned relative to its
                nearest positioned ancestor, such as one with
                <code>position: relative</code>.
            </p>

            <h4>3. fixed</h4>

            <p>
                <code>position: fixed</code> removes the element from normal
                document flow and positions it relative to the viewport in
                typical cases. It stays in place while the page scrolls.
            </p>

            <p>
                It is commonly used for fixed navigation bars, floating
                buttons, or other elements that should remain visible.
            </p>

            <h4>4. sticky</h4>

            <p>
                <code>position: sticky</code> behaves like a relatively
                positioned element until a specified scroll threshold is

        /* =========================
           RENDER QUESTIONS
        ========================= */

        const container =
            document.getElementById("questions");


        questions.forEach((item, index) => {

            const card =
                document.createElement("div");


            card.className =
                "question-card";


            card.innerHTML = `

                <button
                    class="question-btn"
                    type="button"
                >

                    <span>
                        ${index + 1}. ${item.question}
                    </span>

                    <span class="arrow">
                        ⌄
                    </span>

                </button>


                <div class="answer">

                    ${item.answer}

                </div>

            `;


            const button =
                card.querySelector(".question-btn");


            button.addEventListener("click", () => {

                card.classList.toggle("open");

            });


            container.appendChild(card);

        });


        /* =========================
           MOBILE MENU
        ========================= */

        const menuBtn =
            document.getElementById("menuBtn");


        const mobileMenu =
            document.getElementById("mobileMenu");


        menuBtn.addEventListener("click", () => {

            mobileMenu.classList.toggle("open");


            if (mobileMenu.classList.contains("open")) {

                menuBtn.textContent = "✕";

            } else {

                menuBtn.textContent = "☰";

            }

        });


        /* CLOSE MENU AFTER CLICKING LINK */

        const mobileLinks =
            mobileMenu.querySelectorAll("a");


        mobileLinks.forEach(link => {

            link.addEventListener("click", () => {

                mobileMenu.classList.remove("open");

                menuBtn.textContent = "☰";

            });

        });


        /* =========================
           THEME
        ========================= */

        const themeBtn =
            document.getElementById("themeBtn");


        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeBtn.textContent = "☀";

        }


        themeBtn.addEventListener("click", () => {

            document.body.classList.toggle("dark");


            const isDark =
                document.body.classList.contains("dark");


            localStorage.setItem(
                "theme",
                isDark ? "dark" : "light"
            );


            themeBtn.textContent =
                isDark ? "☀" : "☾";

        });

    </script>
