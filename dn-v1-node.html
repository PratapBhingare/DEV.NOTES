    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           THEME VARIABLES
        ========================= */

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;

            --text: #0f172a;
            --muted: #64748b;

            --border: #e2e8f0;

            --accent: #2563eb;
            --accent-soft: #eff6ff;
        }


        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #263449;

            --text: #f8fafc;
            --muted: #94a3b8;

            --border: #334155;

            --accent: #60a5fa;
            --accent-soft: #172554;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: var(--surface);

            border-bottom: 1px solid var(--border);
        }


        .nav-container {
            max-width: 1100px;

            margin: auto;

            padding: 14px 20px;

            display: flex;
            align-items: center;
            gap: 20px;
        }


        /* LOGO */

        .logo {
            color: var(--text);

            text-decoration: none;

            font-size: 18px;
            font-weight: 700;

            white-space: nowrap;
        }


        .logo span {
            color: var(--accent);
        }


        /* DESKTOP NAVIGATION */

        .nav-links {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;
        }


        .nav-links a {
            color: var(--muted);

            text-decoration: none;

            font-size: 14px;

            padding: 8px 10px;

            border-radius: 7px;

            transition: 0.2s;
        }


        .nav-links a:hover {
            background: var(--surface-hover);
            color: var(--text);
        }


        .nav-links a.active {
            background: var(--accent-soft);
            color: var(--accent);
        }


        /* =========================
           NAV ACTIONS
        ========================= */

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /* THEME BUTTON */

        .theme-btn {
            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 16px;

            transition: 0.2s;
        }


        .theme-btn:hover {
            background: var(--surface-hover);
        }


        /* MOBILE MENU BUTTON */

        .menu-btn {
            display: none;

            width: 36px;
            height: 36px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 20px;
        }


        /* =========================
           MOBILE DROPDOWN
        ========================= */

        .mobile-menu {
            display: none;

            max-width: 1100px;

            margin: auto;

            padding: 0 15px 15px;
        }


        .mobile-menu.open {
            display: block;
        }


        .mobile-menu a {
            display: block;

            color: var(--muted);

            text-decoration: none;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 15px;

            transition: 0.2s;
        }


        .mobile-menu a:hover,
        .mobile-menu a.active {
            background: var(--surface-hover);
            color: var(--text);
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 850px;

            margin: auto;

            padding: 70px 20px 100px;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            margin-bottom: 40px;
        }


        .page-header span {
            color: var(--accent);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.5px;
        }


        .page-header h1 {
            font-size: clamp(32px, 5vw, 48px);

            line-height: 1.1;

            margin: 10px 0;

            letter-spacing: -1px;
        }


        .page-header p {
            color: var(--muted);

            line-height: 1.7;

            max-width: 650px;

            font-size: 15px;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {
            width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 12px;

            margin-bottom: 14px;

            overflow: hidden;

            transition:
                border-color 0.2s,
                transform 0.2s;
        }


        .question-card:hover {
            border-color: color-mix(in srgb,
                    var(--accent) 40%,
                    var(--border));
        }


        /* QUESTION BUTTON */

        .question-btn {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 20px;

            border: none;

            background: transparent;

            color: var(--text);

            text-align: left;

            font-family: inherit;

            font-size: 16px;
            font-weight: 600;

            line-height: 1.5;

            cursor: pointer;
        }


        .question-btn:hover {
            background: var(--surface-hover);
        }


        /* ARROW */

        .arrow {
            flex-shrink: 0;

            color: var(--muted);

            font-size: 18px;

            transition: transform 0.2s;
        }


        /* ANSWER */

        .answer {
            display: none;

            padding: 0 20px 20px;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.8;
        }


        .question-card.open .answer {
            display: block;
        }


        .question-card.open .arrow {
            transform: rotate(180deg);
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .nav-container {
                padding: 13px 16px;
            }


            .nav-links {
                display: none;
            }


            .menu-btn {
                display: block;
            }


            .nav-actions {
                margin-left: auto;
            }


            main {
                padding-top: 55px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav-container {
                padding: 11px 14px;
            }


            .logo {
                font-size: 17px;
            }


            .menu-btn,
            .theme-btn {
                width: 34px;
                height: 34px;
            }


            main {
                padding: 45px 15px 70px;
            }


            .page-header {
                margin-bottom: 30px;
            }


            .page-header span {
                font-size: 11px;
            }


            .page-header h1 {
                font-size: 34px;

                margin-top: 8px;
            }


            .page-header p {
                font-size: 14px;

                line-height: 1.7;
            }


            .question-card {
                border-radius: 10px;

                margin-bottom: 10px;
            }


            .question-btn {
                padding: 16px;

                font-size: 14px;

                gap: 12px;
            }


            .answer {
                padding: 0 16px 17px;

                font-size: 14px;

                line-height: 1.7;
            }


            .arrow {
                font-size: 16px;
            }

        }


        /* =========================
           VERY SMALL DEVICES
        ========================= */

        @media (max-width: 380px) {

            .logo {
                font-size: 16px;
            }


            main {
                padding-left: 12px;
                padding-right: 12px;
            }


            .page-header h1 {
                font-size: 30px;
            }


            .question-btn {
                padding: 14px;

                font-size: 13px;
            }


            .answer {
                padding-left: 14px;
                padding-right: 14px;

                font-size: 13px;
            }

        }
    </style>

    <script>


        /* =========================
           QUESTIONS
        ========================= */

        const questions = [


            {
                question: "What is Node.js and why is it used for backend development?",

                answer: `


<p>
    Node.js is a <strong>JavaScript runtime environment</strong> that allows JavaScript
    to run outside the browser. It is built on Chrome's <strong>V8 JavaScript engine</strong>.
</p>

<p>
    Node.js is commonly used for backend development because it provides
    <strong>non-blocking, asynchronous I/O</strong>, which allows it to handle
    many concurrent requests efficiently.
</p>

<h4>Why is Node.js used for backend development?</h4>

<ul>
    <li>Allows JavaScript to be used on both frontend and backend.</li>
    <li>Uses non-blocking I/O for handling concurrent requests efficiently.</li>
    <li>Has a large ecosystem of packages through npm.</li>
    <li>Works well for REST APIs, real-time applications, and microservices.</li>
    <li>Uses the same language across the full stack.</li>
</ul>

<p>
    In short, Node.js is useful for building fast and scalable
    network applications, especially I/O-heavy applications.
</p>

`
            },


            {
                question: "How does Node.js work internally?",

                answer: `


<p>
    Node.js uses the <strong>V8 JavaScript engine</strong> to execute JavaScript
    and uses an <strong>event-driven, non-blocking architecture</strong> to handle
    asynchronous operations.
</p>

<h4>Basic flow:</h4>

<ol>
    <li>JavaScript code runs on the main thread.</li>
    <li>Synchronous code is executed directly.</li>
    <li>Asynchronous operations such as file I/O, network requests, and timers
        are handled outside the main JavaScript execution flow.</li>
    <li>When an asynchronous operation completes, its callback or promise
        continuation is placed into the appropriate queue.</li>
    <li>The <strong>Event Loop</strong> processes these callbacks when the
        call stack is available.</li>
</ol>

<p>
    This allows Node.js to continue handling other requests instead of
    waiting for every I/O operation to finish.
</p>

<p>
    Node.js also uses components such as <strong>libuv</strong> to provide
    the event loop and handle asynchronous I/O and a thread pool for certain
    operations.
</p>

`
            },


            {
                question: "What is the Node.js Event Loop?",

                answer: `


<p>
    The <strong>Event Loop</strong> is a mechanism in Node.js that allows it
    to handle asynchronous operations without blocking the main JavaScript
    thread.
</p>

<p>
    JavaScript code executes on the call stack. When Node.js encounters an
    asynchronous operation, it can delegate the operation and continue
    executing other code. Once the operation is completed, its callback
    becomes eligible to run, and the Event Loop coordinates when it can
    execute.
</p>

<h4>Example:</h4>

<pre><code>
console.log("Start");

setTimeout(() =&gt; {
    console.log("Timer");
}, 0);

console.log("End");
</code></pre>

<p>
    The output is:
</p>

<pre><code>
Start
End
Timer
</code></pre>

<p>
    Even though the timer is set to <code>0</code> milliseconds, its callback
    does not execute immediately. The synchronous code runs first, and the
    Event Loop later allows the timer callback to execute.
</p>

<p>
    The Event Loop is one of the key reasons Node.js can efficiently handle
    many concurrent I/O operations.
</p>

`
            },


            {
                question: "Is Node.js single-threaded? What does that actually mean?",

                answer: `


<p>
    Yes, Node.js executes JavaScript code on a <strong>single main thread</strong>.
    However, saying Node.js is completely single-threaded is an oversimplification.
</p>

<p>
    Node.js uses the <strong>Event Loop</strong> on the main JavaScript thread
    and can use background threads through <strong>libuv's thread pool</strong>
    for certain operations.
</p>

<h4>What this means:</h4>

<ul>
    <li>JavaScript execution happens primarily on one main thread.</li>
    <li>Node.js does not create a new JavaScript thread for every request.</li>
    <li>Many I/O operations can be handled asynchronously.</li>
    <li>Certain expensive operations can use the libuv thread pool.</li>
    <li>CPU-heavy JavaScript code can still block the main thread.</li>
</ul>

<p>
    So, Node.js is <strong>single-threaded for JavaScript execution</strong>,
    but the runtime itself can use multiple threads internally.
</p>

`
            },


            {
                question: "What is non-blocking I/O?",

                answer: `


<p>
    <strong>Non-blocking I/O</strong> means Node.js does not wait for an
    input/output operation to finish before continuing with other code.
</p>

<p>
    For example, when Node.js reads a file or waits for a database response,
    it can start that operation and continue handling other work. Once the
    operation completes, Node.js processes the result asynchronously.
</p>

<h4>Example:</h4>

<pre><code>
const fs = require("fs");

fs.readFile("data.txt", "utf8", (err, data) =&gt; {
    console.log(data);
});

console.log("This runs without waiting for the file");
</code></pre>

<p>
    Here, Node.js starts reading the file and immediately continues to the
    next statement instead of blocking until the file is completely read.
</p>

<p>
    This makes Node.js well suited for applications that perform many
    I/O operations such as APIs, database requests, and network requests.
</p>

`
            },


            {
                question: "What is the difference between synchronous and asynchronous operations in Node.js?",

                answer: `


<p>
    <strong>Synchronous operations</strong> execute one after another and
    block the execution until the current operation finishes.
</p>

<p>
    <strong>Asynchronous operations</strong> allow Node.js to start an operation
    and continue executing other code while waiting for that operation to finish.
</p>

<h4>Example:</h4>

<pre><code>
const fs = require("fs");

const data = fs.readFileSync("data.txt", "utf8");

console.log(data);

console.log("Finished");
</code></pre>

<p>
    <code>readFileSync()</code> is synchronous, so Node.js waits for the file
    operation to complete before continuing.
</p>

<p>
    An asynchronous version would use <code>readFile()</code>, allowing other
    code to execute while the file is being read.
</p>

<h4>Key difference:</h4>

<ul>
    <li><strong>Synchronous:</strong> Blocks execution until the operation finishes.</li>
    <li><strong>Asynchronous:</strong> Does not block execution while waiting for I/O.</li>
</ul>

`
            },


            {
                question: "What are callbacks, Promises, and async/await in Node.js?",

                answer: `


<p>
    Callbacks, Promises, and <code>async/await</code> are different ways of
    handling asynchronous operations in JavaScript and Node.js.
</p>

<h4>1. Callback</h4>

<p>
    A callback is a function passed to another function that is executed
    after an asynchronous operation completes.
</p>

<pre><code>
fs.readFile("data.txt", "utf8", (err, data) =&gt; {
    if (err) {
        console.log(err);
        return;
    }

    console.log(data);
});
</code></pre>

<h4>2. Promise</h4>

<p>
    A Promise represents the eventual success or failure of an asynchronous
    operation. It can be handled using <code>.then()</code> and
    <code>.catch()</code>.
</p>

<pre><code>
fetchData()
    .then(data =&gt; console.log(data))
    .catch(error =&gt; console.log(error));
</code></pre>

<h4>3. async/await</h4>

<p>
    <code>async/await</code> provides a cleaner way to work with Promises.
    An <code>async</code> function returns a Promise, and <code>await</code>
    pauses that function until the Promise settles.
</p>

<pre><code>
async function getData() {
    try {
        const data = await fetchData();
        console.log(data);
    } catch (error) {
        console.log(error);
    }
}
</code></pre>

<p>
    In modern Node.js applications, <strong>Promises and async/await</strong>
    are commonly preferred because they make asynchronous code easier to
    read and maintain.
</p>

`
            },


            {
                question: "What is the difference between Node.js and browser JavaScript?",

                answer: `


<p>
    Both Node.js and browsers use JavaScript, but they provide different
    runtime environments and APIs.
</p>

<h4>Major differences:</h4>

<ul>
    <li>
        <strong>Runtime:</strong> Browser JavaScript runs inside a browser,
        while Node.js runs outside the browser.
    </li>


<li>
    <strong>Environment APIs:</strong> Browsers provide APIs such as
    DOM, <code>window</code>, and <code>document</code>. Node.js provides
    APIs such as <code>fs</code>, <code>path</code>, and <code>http</code>.
</li>

<li>
    <strong>DOM:</strong> Browsers can directly manipulate the DOM.
    Node.js does not have a browser DOM by default.
</li>

<li>
    <strong>File system:</strong> Node.js can access the server's file
    system through its APIs, while browser JavaScript has restricted
    access for security reasons.
</li>

<li>
    <strong>Modules:</strong> Node.js supports CommonJS and ES Modules,
    while browsers primarily use ES Modules for native module loading.
</li>


</ul>

<p>
    In simple terms, <strong>browser JavaScript is mainly used for client-side
    applications</strong>, while <strong>Node.js allows JavaScript to be used
    for server-side applications</strong>.
</p>

`
            },


            {
                question: "What is npm?",

                answer: `


<p>
    <strong>npm</strong> stands for <strong>Node Package Manager</strong>.
    It is the default package manager commonly used with Node.js.
</p>

<p>
    npm allows developers to install, update, remove, and manage
    JavaScript packages and their dependencies.
</p>

<h4>Example:</h4>

<pre><code>
npm install express
</code></pre>

<p>
    This installs the <code>express</code> package into the project and
    records it as a dependency in <code>package.json</code>.
</p>

<h4>Common npm commands:</h4>

<pre><code>
npm init
npm install express
npm install -D nodemon
npm uninstall express
npm update
npm run dev
</code></pre>

<p>
    npm also provides scripts, dependency management, and access to a large
    ecosystem of reusable packages.
</p>

`
            },


            {
                question: "What is package.json?",

                answer: `


<p>
    <strong>package.json</strong> is a configuration file that contains
    important information about a Node.js project.
</p>

<p>
    It describes the project, its dependencies, available scripts,
    version, and other configuration details.
</p>

<h4>Example:</h4>

<pre><code>
{
    "name": "my-app",
    "version": "1.0.0",
    "scripts": {
        "start": "node server.js",
        "dev": "nodemon server.js"
    },
    "dependencies": {
        "express": "^5.0.0"
    },
    "devDependencies": {
        "nodemon": "^3.0.0"
    }
}
</code></pre>

<h4>Important sections:</h4>

<ul>
    <li><strong>name:</strong> Name of the project.</li>
    <li><strong>version:</strong> Current project version.</li>
    <li><strong>scripts:</strong> Commands that can be executed using npm.</li>
    <li><strong>dependencies:</strong> Packages required by the application.</li>
    <li><strong>devDependencies:</strong> Packages mainly required during development.</li>
</ul>

<p>
    In short, <code>package.json</code> acts as the main configuration and
    dependency-manifest file for a Node.js project.
</p>

`
            },


            {
                question: "What is the difference between dependencies and devDependencies?",

                answer: `


<p>
    Both <code>dependencies</code> and <code>devDependencies</code> contain
    packages used by a Node.js project, but they have different purposes.
</p>

<h4>dependencies</h4>

<p>
    These are packages required for the application to <strong>run in production</strong>.
</p>

<pre><code>
npm install express
</code></pre>

<p>
    Example: <code>express</code>, <code>mongoose</code>, and other packages
    that the running application needs.
</p>

<h4>devDependencies</h4>

<p>
    These are packages mainly required during <strong>development, testing,
    linting, or building</strong>.
</p>

<pre><code>
npm install -D nodemon
</code></pre>

<p>
    Example: <code>nodemon</code>, testing tools, linters, and development
    utilities.
</p>

<h4>Key difference:</h4>

<ul>
    <li>
        <strong>dependencies:</strong> Required for the application to run.
    </li>
    <li>
        <strong>devDependencies:</strong> Mainly required while developing
        or building the application.
    </li>
</ul>

`
            },


            {
                question: "What is package-lock.json and why is it important?",

                answer: `


<p>
    <strong>package-lock.json</strong> is a file automatically generated by npm
    that records the exact versions of the project's installed dependencies
    and their dependency tree.
</p>

<p>
    While <code>package.json</code> can contain version ranges such as
    <code>^1.2.3</code>, <code>package-lock.json</code> records the specific
    versions that were resolved and installed.
</p>

<h4>Why is it important?</h4>

<ul>
    <li>
        Ensures developers install consistent dependency versions.
    </li>
    <li>
        Makes installations more predictable across different environments.
    </li>
    <li>
        Helps prevent unexpected changes caused by dependency updates.
    </li>
    <li>
        Records the complete dependency tree, including transitive dependencies.
    </li>
</ul>

<p>
    Therefore, <code>package.json</code> describes the project's dependency
    requirements, while <code>package-lock.json</code> locks the resolved
    dependency versions used by the project.
</p>

`
            },
            {
                question: "What is the difference between dependencies and devDependencies?",

                answer: `


<p>
    <code>dependencies</code> are packages required by the application
    when it runs in production, while <code>devDependencies</code> are
    packages mainly required during development.
</p>

        const container =
            document.getElementById("questions");


        questions.forEach((item, index) => {

            const card =
                document.createElement("div");


            card.className =
                "question-card";


            card.innerHTML = `

                <button
                    class="question-btn"
                    type="button"
                >

                    <span>
                        ${index + 1}. ${item.question}
                    </span>

                    <span class="arrow">
                        ⌄
                    </span>

                </button>


                <div class="answer">

                    ${item.answer}

                </div>

            `;


            const button =
                card.querySelector(".question-btn");


            button.addEventListener("click", () => {

                card.classList.toggle("open");

            });


            container.appendChild(card);

        });


        /* =========================
           MOBILE MENU
        ========================= */

        const menuBtn =
            document.getElementById("menuBtn");


        const mobileMenu =
            document.getElementById("mobileMenu");


        menuBtn.addEventListener("click", () => {

            mobileMenu.classList.toggle("open");


            if (mobileMenu.classList.contains("open")) {

                menuBtn.textContent = "✕";

            } else {

                menuBtn.textContent = "☰";

            }

        });


        /* CLOSE MENU AFTER CLICKING LINK */

        const mobileLinks =
            mobileMenu.querySelectorAll("a");


        mobileLinks.forEach(link => {

            link.addEventListener("click", () => {

                mobileMenu.classList.remove("open");

                menuBtn.textContent = "☰";

            });

        });


        /* =========================
           THEME
        ========================= */

        const themeBtn =
            document.getElementById("themeBtn");


        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeBtn.textContent = "☀";

        }


        themeBtn.addEventListener("click", () => {

            document.body.classList.toggle("dark");


            const isDark =
                document.body.classList.contains("dark");


            localStorage.setItem(
                "theme",
                isDark ? "dark" : "light"
            );


            themeBtn.textContent =
                isDark ? "☀" : "☾";

        });

    </script>
